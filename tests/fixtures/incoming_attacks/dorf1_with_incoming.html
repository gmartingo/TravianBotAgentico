<!DOCTYPE html>
<html>
<head><title>dorf1 con ataque entrante — fixture radar-ataques-entrantes</title></head>
<body>
<!--
  Fixture: dorf1.php con movimiento de tropas entrante (img.att1) y saliente (img.att2).
  El parser Dorf1IncomingParser SOLO extrae los entrantes (img.att1).
  Los salientes (img.att2) deben ser ignorados.

  Ataque entrante:
    - img.att1
    - span.timer value="1818" data-value="1818" → seconds_to_impact=1818
    - span.a1 → "1 Attack" → attack_count=1
    - href del <a> padre → "build.php?gid=16&tt=1&filter=1&subfilters=1"

  Ataque saliente (debe ignorarse):
    - img.att2
    - span.timer value="900"
    - span.a1 → "5 Attacks"

  Ver spec docs/specs/radar-ataques-entrantes.md §9.4, §12 UT-RB01/UT-RB02.
-->
<div id="content">

  <div id="troopMovements">

    <!-- Fila de ataque ENTRANTE (img.att1) -->
    <table>
      <tbody>
        <tr>
          <td>
            <a href="build.php?gid=16&amp;tt=1&amp;filter=1&amp;subfilters=1">
              <img class="att1" src="/img/x.gif" alt="Incoming attack">
            </a>
          </td>
          <td>
            <span class="village">07 (−68|73)</span>
          </td>
          <td>
            <span class="troopName">Legionnaire</span>
          </td>
        </tr>
        <!-- La fila siguiente contiene el timer y la cantidad -->
        <tr>
          <td>
            <span class="timer" value="1818" data-value="1818">30:18</span>
          </td>
          <td>
            <span class="a1">1 Attack</span>
          </td>
          <td></td>
        </tr>
      </tbody>
    </table>

    <!-- Fila de ataque SALIENTE (img.att2) — debe ignorarse -->
    <table>
      <tbody>
        <tr>
          <td>
            <a href="build.php?gid=16&amp;tt=2&amp;filter=2">
              <img class="att2" src="/img/x.gif" alt="Outgoing attack">
            </a>
          </td>
          <td>
            <span class="village">Destino (10|20)</span>
          </td>
        </tr>
        <tr>
          <td>
            <span class="timer" value="900" data-value="900">15:00</span>
          </td>
          <td>
            <span class="a1">5 Attacks</span>
          </td>
        </tr>
      </tbody>
    </table>

  </div>

</div>
</body>
</html>
