openapi: 3.1.0
info:
  title: TravianBot API
  version: 1.0.0
  description: |
    API interna del bot de Travian. Sin prefijo /api en las rutas
    (el proxy de Vite lo retira antes de redirigir a :8000).

    FastAPI genera el OpenAPI completo automáticamente en /docs y /openapi.json.
    Este archivo documenta: EP-06, EP-09, EP-10, EP-SPAWN, EP-TD (attack-reports);
    EP-HS01..EP-HS07 (session); EP-N01..EP-N14 (noise);
    EP-RT01..EP-RT10 (route-templates — Portal de Desarrollador de Rutas).
    Delta EP-N03/EP-N04: campo template_id (int|null) en NoiseDestination.
    Última actualización: 2026-06-05.

servers:
  - url: http://localhost:8000
    description: Servidor de desarrollo local

components:
  schemas:
    DetailError:
      type: object
      description: |
        Error estándar de FastAPI. El proyecto usa `detail` (no el formato
        CABECERAS MÍNIMAS con `error.code`) porque los routers delegan en
        HTTPException que serializa `detail`.
      required: [detail]
      properties:
        detail:
          type: string
          description: Mensaje de error legible.

    SpeciesColumn:
      type: object
      required: [animal_ordinal, animal_name, icon_url]
      properties:
        animal_ordinal:
          type: integer
          minimum: 1
          maximum: 10
          description: Identificador único de la especie (1=Rat..10)
        animal_name:
          type: string
          description: Nombre crudo de la especie (texto del usuario, no localizado)
        icon_url:
          type: string
          description: "Ruta del icono: /static/icons/nature_{animal_ordinal}.png"

    SpeciesEntry:
      type: object
      required: [animal_ordinal, animal_name, icon_url, avg_regen_per_hour, valid_intervals, last_survived, projected_now]
      properties:
        animal_ordinal:
          type: integer
        animal_name:
          type: string
        icon_url:
          type: string
        avg_regen_per_hour:
          type: number
          format: float
          description: Media aritmética de tasas de regeneración (animales/hora)
        valid_intervals:
          type: integer
          minimum: 1
          description: Número de intervalos válidos que contribuyeron a la tasa
        last_survived:
          type: [integer, "null"]
          description: survived del último reporte; null si fue derrota
        projected_now:
          type: [integer, "null"]
          description: "floor(last_survived + avg_regen_per_hour × hours_since_last_attack); null si last_survived es null"

    OasisEntry:
      type: object
      required: [coord_x_dest, coord_y_dest, total_attacks, last_attack, hours_since_last_attack, has_rates, species]
      properties:
        coord_x_dest:
          type: integer
          description: Coordenada X del oasis
        coord_y_dest:
          type: integer
          description: Coordenada Y del oasis
        total_attacks:
          type: integer
          minimum: 1
        last_attack:
          type: string
          description: "attacked_at del último reporte (ISO 8601 naive — hora local Travian, sin zona)"
          example: "2026-05-30T20:15:00"
        hours_since_last_attack:
          type: number
          format: float
          minimum: 0
          description: Horas entre last_attack (ajustado a UTC con utc_offset) y computed_at. Redondeado a 2 decimales.
        has_rates:
          type: boolean
          description: true si al menos una especie tiene tasa calculable
        species:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesEntry"
          description: Solo especies con tasa válida para este oasis. Ausencia = celda "—" en la UI.

    ResourceBreakdown:
      type: object
      description: Desglose de recursos por tipo + total
      required: [wood, clay, iron, crop, total]
      properties:
        wood:  { type: integer, minimum: 0 }
        clay:  { type: integer, minimum: 0 }
        iron:  { type: integer, minimum: 0 }
        crop:  { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    BalanceStats:
      type: object
      description: |
        Balance agregado de un oasis (o global si sin filtro de coordenada).
        Mismo shape que GET /attack-reports/stats/balance.
      required: [range, total_reports, reports_without_tribe, lost, stolen, net]
      properties:
        range:
          type: object
          description: Rango de fechas cubierto por los reportes incluidos
          properties:
            from:  { type: [string, "null"], format: date-time }
            to:    { type: [string, "null"], format: date-time }
        total_reports:
          type: integer
          minimum: 0
        reports_without_tribe:
          type: integer
          minimum: 0
          description: Reportes cuya tribu no pudo resolverse (coste de bajas se omite para ellos)
        lost:
          $ref: "#/components/schemas/ResourceBreakdown"
          description: Valor en recursos de las tropas atacantes muertas
        stolen:
          type: object
          description: Recursos robados al oasis (botín + inventario del héroe)
          required: [bounty, hero_inventory, total]
          properties:
            bounty:
              $ref: "#/components/schemas/ResourceBreakdown"
            hero_inventory:
              $ref: "#/components/schemas/ResourceBreakdown"
            total:
              $ref: "#/components/schemas/ResourceBreakdown"
        net:
          type: integer
          description: "stolen.total.total − lost.total (positivo = ganancia neta)"

    AnimalAppearance:
      type: object
      description: Número de animales de cada especie observados en un reporte (shape EP-06 por oasis)
      properties:
        attacked_at:  { type: string, format: date-time }
        animal_name:  { type: string }
        present:      { type: [integer, "null"] }
        killed:       { type: [integer, "null"] }
        survived:     { type: [integer, "null"] }

    GlobalAnimalAppearance:
      type: object
      description: |
        Item del array animal_appearances[] de la respuesta global de EP-09.
        Shape distinto a AnimalAppearance (EP-06): agrega estadísticas de aparición
        sobre todos los reportes globales en lugar de mostrar un reporte individual.
      required:
        - animal_ordinal
        - animal_name
        - appearances
        - eligible_reports
        - max_present
      properties:
        animal_ordinal:
          type: integer
          minimum: 1
          maximum: 10
          description: Identificador único de la especie (1=Rat..10)
        animal_name:
          type: string
          description: Nombre crudo de la especie (texto del usuario, no localizado)
        appearances:
          type: integer
          minimum: 1
          description: Número de reportes globales en que present > 0 para esta especie
        eligible_reports:
          type: integer
          minimum: 1
          description: |
            Denominador del % de aparición: número de reportes que pertenecen a oasis
            donde esta especie ha aparecido alguna vez (present > 0 en algún reporte de
            ese oasis). Invariante: eligible_reports >= appearances.
            Valor mínimo 1 cuando appearances >= 1 (garantizado por diseño SQL).
        avg_present:
          type: [number, "null"]
          format: float
          description: Media de animales presentes en los reportes donde present > 0. Redondeado a 2 decimales; null si sin datos.
        max_present:
          type: integer
          minimum: 1
          description: Máximo de animales presentes en algún reporte con present > 0
        min_present:
          type: [integer, "null"]
          minimum: 1
          description: Mínimo de animales presentes en reportes con present > 0; null si sin datos (guardia defensiva)

    GlobalAnimalRegenRate:
      type: object
      description: Tasa de regeneración estimada de una especie a nivel global (EP-09)
      required:
        - animal_ordinal
        - animal_name
        - avg_regen_per_hour
        - valid_intervals
      properties:
        animal_ordinal:
          type: integer
          minimum: 1
          maximum: 10
        animal_name:
          type: string
        avg_regen_per_hour:
          type: number
          format: float
          description: Media aritmética de tasas de regeneración globales (animales/hora). Redondeado a 2 decimales.
        valid_intervals:
          type: integer
          minimum: 1
          description: Número de intervalos válidos que contribuyeron a la tasa

    GlobalOasisStatsResponse:
      type: object
      description: |
        Respuesta de EP-09 GET /attack-reports/stats/global.
        Agrega estadísticas de aparición y tasas de regeneración de todos los oasis conocidos.
        200 siempre, incluso con BD vacía (arrays vacíos).
      required:
        - scope
        - animal_appearances
        - animal_regen_rates
      properties:
        scope:
          type: string
          enum: [global]
          description: Siempre "global" en EP-09
        animal_appearances:
          type: array
          items:
            $ref: "#/components/schemas/GlobalAnimalAppearance"
          description: |
            Una entrada por especie que haya aparecido al menos una vez en toda la BD.
            Array vacío si no hay reportes.
        animal_regen_rates:
          type: array
          items:
            $ref: "#/components/schemas/GlobalAnimalRegenRate"
          description: |
            Tasa media de regeneración por especie a nivel global.
            Array vacío si menos de 2 reportes totales.

    RegeneratedAnimal:
      type: object
      properties:
        animal_name:    { type: string }
        prev_survived:  { type: [integer, "null"] }
        regenerated:    { type: [integer, "null"] }
        present:        { type: [integer, "null"] }

    RepopulationGap:
      type: object
      description: Intervalo entre dos ataques consecutivos al mismo oasis
      properties:
        attacked_at:        { type: string, format: date-time }
        prev_attacked_at:   { type: [string, "null"], format: date-time }
        gap_seconds:        { type: [integer, "null"], minimum: 0 }
        regenerated_animals:
          type: array
          items: { $ref: "#/components/schemas/RegeneratedAnimal" }

    AnimalRegenRate:
      type: object
      description: Tasa de regeneración estimada de una especie para este oasis
      properties:
        animal_name:       { type: string }
        avg_regen_per_hour: { type: [number, "null"], format: float }
        valid_intervals:   { type: integer, minimum: 0 }

    OasisStatsResponse:
      type: object
      description: |
        Respuesta de EP-06 GET /attack-reports/stats/oasis.
        Incluye estadísticas de aparición/repoblación y el balance de recursos del oasis.
      required:
        - coord_x_dest
        - coord_y_dest
        - total_attacks
        - first_attack
        - last_attack
        - animal_appearances
        - repopulation_gaps
        - animal_regen_rates
        - balance
      properties:
        coord_x_dest:
          type: integer
        coord_y_dest:
          type: integer
        total_attacks:
          type: integer
          minimum: 0
        first_attack:
          type: [string, "null"]
          format: date-time
          description: Fecha del primer ataque registrado; null si no hay reportes
        last_attack:
          type: [string, "null"]
          format: date-time
          description: Fecha del último ataque registrado; null si no hay reportes
        animal_appearances:
          type: array
          items:
            $ref: "#/components/schemas/AnimalAppearance"
          description: Historial de animales presentes/muertos por reporte
        repopulation_gaps:
          type: array
          items:
            $ref: "#/components/schemas/RepopulationGap"
          description: Intervalos entre ataques consecutivos con cálculo de regeneración
        animal_regen_rates:
          type: array
          items:
            $ref: "#/components/schemas/AnimalRegenRate"
          description: Tasa media de regeneración por especie (vacío si menos de 2 ataques)
        balance:
          $ref: "#/components/schemas/BalanceStats"
          description: |
            Balance agregado del oasis: bajas (coste en recursos de tropas muertas),
            recursos robados (botín + inventario del héroe) y neto.
            Mismo shape y lógica que GET /attack-reports/stats/balance?x=…&y=….

    OasisComparisonResponse:
      type: object
      required: [computed_at, species_columns, oasis]
      properties:
        computed_at:
          type: string
          format: date-time
          description: Instante UTC en que se calculó la proyección
        species_columns:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesColumn"
          description: Columnas dinámicas de la tabla (unión de especies con tasa en algún oasis)
        oasis:
          type: array
          items:
            $ref: "#/components/schemas/OasisEntry"
          description: |
            Oasis ordenados: has_rates=true primero, luego last_attack DESC dentro de cada grupo.
            Array vacío si BD sin reportes.

    # ── EP-TD v4 schemas ────────────────────────────────────────────────────
    # v3 (2026-06-02): sustituye la lista plana `animals` de v2 por `types[]` (5 secciones
    # fijas por tipo de oasis inferido). TemporalDistributionWindow y
    # TemporalDistributionAnimalEntry se conservan sin cambio; se añaden
    # TemporalDistributionTypeSection y TemporalDistributionResponse se reescribe.
    # v4 (2026-06-02): añade max_present a TemporalDistributionAnimalEntry; añade
    # oasis_coords, avg_bounty y total_animals a TemporalDistributionTypeSection.
    # Nuevos sub-schemas: TemporalDistributionBounty, TemporalDistributionTotalAnimals,
    # TemporalDistributionCoord.

    TemporalDistributionCoord:
      type: object
      description: |
        Par de coordenadas enteras de un oasis (x, y).
        El frontend formatea como "(-15|23)"; el backend devuelve enteros crudos.
        Convención: mismo par de enteros que coord_x_dest/coord_y_dest en el resto de la API,
        pero con nombres cortos "x" e "y" porque el contexto de la sección ya los identifica
        como coordenadas de oasis (no de destino de tropas). Coherente con el spec v4 que
        define {x, y} para este campo específico de agregación de oasis.
      required: [x, y]
      properties:
        x:
          type: integer
          description: Coordenada X del oasis (puede ser negativa).
        y:
          type: integer
          description: Coordenada Y del oasis (puede ser negativa).

    TemporalDistributionBounty:
      type: object
      description: |
        Media de botín (recursos robados al oasis) por reporte en la sección, redondeada
        al entero. Denominador = n_reports_in_section (TODOS los reportes, incluidas
        derrotas con bounty=0, porque bounty_* es NOT NULL DEFAULT 0 en el DDL).
        Si n_reports_in_section=0 todos los campos son 0 (no null).
        El campo total se calcula como media de (w+c+i+cr) por reporte, NO como la suma
        de las cuatro medias individuales (pueden diferir en ±1 por redondeo independiente).
      required: [wood, clay, iron, crop, total]
      properties:
        wood:
          type: integer
          minimum: 0
          description: Media de bounty_wood redondeada al entero más cercano (redondeo bancario Python 3).
        clay:
          type: integer
          minimum: 0
          description: Media de bounty_clay redondeada al entero más cercano.
        iron:
          type: integer
          minimum: 0
          description: Media de bounty_iron redondeada al entero más cercano.
        crop:
          type: integer
          minimum: 0
          description: Media de bounty_crop redondeada al entero más cercano.
        total:
          type: integer
          minimum: 0
          description: |
            Media de (bounty_wood + bounty_clay + bounty_iron + bounty_crop) redondeada
            al entero. NO es wood+clay+iron+crop (puede diferir en ±1 por redondeo).

    TemporalDistributionTotalAnimals:
      type: object
      description: |
        Distribución del número total de animales por reporte en la sección.
        "Total de animales" de un reporte = suma de present de todos sus animales.
        Regla "todo o nada": un reporte entra en n_valid SOLO si TODOS sus animales
        tienen present no nulo. Si cualquier animal tiene present=NULL, el reporte
        se excluye del cálculo de avg/mode/max pero cuenta en n_total.
        Justificación: sumar animals parciales daría un total sesgado a la baja.
      required: [avg, mode, max, n_valid, n_total]
      properties:
        avg:
          type: [number, "null"]
          format: float
          description: |
            Media del total de animales por reporte, redondeada a 2 decimales.
            null si n_valid=0.
        mode:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            Moda(s) del total de animales. [] si n_valid=0.
            Si hay empate, contiene todos los valores empatados ASC.
        max:
          type: [integer, "null"]
          minimum: 0
          description: Máximo del total de animales observado. null si n_valid=0.
        n_valid:
          type: integer
          minimum: 0
          description: |
            Reportes con TODOS los animales no nulos (victorias completas). Son el
            denominador de avg, mode y max.
        n_total:
          type: integer
          minimum: 0
          description: |
            Total de report_ids distintos en la sección. Siempre igual a
            n_reports_in_section de la sección padre. Se incluye aquí por consistencia
            con el patrón n_valid/n_total del proyecto, para que el frontend calcule
            la tasa de reportes válidos sin consultar el campo padre.

    TemporalDistributionWindow:
      type: object
      description: |
        Ventana de gaps (en minutos) correspondiente a la frecuencia solicitada.
        Frontera: inclusiva por abajo, exclusiva por arriba [lower_min, upper_min).
        Para interval_minutes=300 la ventana es abierta: [300, ∞).
      required:
        - lower_min
        - upper_min
        - is_open
      properties:
        lower_min:
          type: integer
          minimum: 1
          description: Límite inferior de la ventana en minutos (inclusive).
        upper_min:
          type: [integer, "null"]
          minimum: 1
          description: |
            Límite superior de la ventana en minutos (exclusive).
            null solo para interval_minutes=300 (ventana abierta).
        is_open:
          type: boolean
          description: true solo para interval_minutes=300 (ventana [300, ∞)).

    TemporalDistributionAnimalEntry:
      type: object
      description: |
        Estadísticas de un animal concreto dentro de una sección de tipo de oasis.
        Solo aparecen animales con al menos un reporte (n_total > 0) en la sección.
        n_total y n_valid se calculan sobre los gaps de oasis del tipo de esa sección.
        v4: añadido max_present (máximo sobre n_valid, null si n_valid=0).
      required:
        - animal_ordinal
        - animal_name
        - icon_url
        - avg_present
        - mode_present
        - max_present
        - n_total
        - n_valid
      properties:
        animal_ordinal:
          type: integer
          minimum: 1
          maximum: 10
          description: Identificador único del animal (1=Rat..10, catálogo NATURE).
        animal_name:
          type: string
          description: |
            Nombre localizado del animal en el idioma solicitado por Accept-Language.
            Fallback al animal_name crudo de la BD si el ordinal no está en el catálogo.
        icon_url:
          type: string
          description: "Ruta del icono: /static/icons/nature_{animal_ordinal}.png"
        avg_present:
          type: [number, "null"]
          format: float
          description: |
            Media de present redondeada a 2 decimales sobre los n_valid de esta sección.
            null si n_valid=0 (todos los reportes del animal en esta sección son derrota).
        mode_present:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            Moda(s) de present entre los n_valid reportes válidos (Python Counter).
            Lista vacía si n_valid=0. Si hay empate, contiene todos los valores ASC.
        max_present:
          type: [integer, "null"]
          minimum: 0
          description: |
            Máximo de present observado en los n_valid reportes de esta sección para este animal.
            null si n_valid=0 (misma regla de NULL que avg_present y mode_present).
            Se calcula como max(present for present not null). [NUEVO v4]
        n_total:
          type: integer
          minimum: 0
          description: |
            Gaps de oasis de este tipo en la ventana donde aparece este animal
            (incluye derrotas con present=null). Invariante: n_total >= n_valid.
        n_valid:
          type: integer
          minimum: 0
          description: |
            Gaps con present IS NOT NULL en esta sección para este animal.
            Son el denominador de avg_present, mode_present y max_present.

    TemporalDistributionTypeSection:
      type: object
      description: |
        Sección de una respuesta EP-TD v4 agrupada por tipo de oasis inferido.
        Siempre presente en el array types[] aunque no haya datos (sección vacía).
        v4: añadidos oasis_coords, avg_bounty y total_animals.
      required:
        - oasis_type
        - oasis_type_label
        - n_oasis
        - n_oasis_low_confidence
        - n_reports_in_section
        - oasis_coords
        - avg_bounty
        - total_animals
        - animals
      properties:
        oasis_type:
          type: string
          enum: [hierro, arcilla, madera, cereal, sin_clasificar]
          description: |
            Clave canónica interna del tipo de oasis. Valores fijos:
            "hierro" | "arcilla" | "madera" | "cereal" | "sin_clasificar".
            El orden en el array types[] es siempre: hierro, arcilla, madera, cereal, sin_clasificar.
        oasis_type_label:
          type: string
          enum: [Hierro, Barro, Madera, Cereal, "Sin clasificar"]
          description: |
            Etiqueta de presentación fija (no localizada, siempre en castellano).
            OJO: la clave interna "arcilla" tiene label "Barro" (terminología del usuario).
            Mapa fijo: hierro→"Hierro", arcilla→"Barro", madera→"Madera",
            cereal→"Cereal", sin_clasificar→"Sin clasificar".
        n_oasis:
          type: integer
          minimum: 0
          description: |
            Número de oasis distintos de este tipo con al menos un gap en la ventana.
            0 si la sección está vacía.
        n_oasis_low_confidence:
          type: integer
          minimum: 0
          description: |
            Cuántos de esos oasis tienen confidence="low" (< 3 bursts observados con
            present > 0). 0 si ninguno o sección vacía. El frontend puede mostrar un
            disclaimer "pocos datos" con este campo. Los oasis de baja confianza se
            incluyen en su sección de tipo; no se mueven a sin_clasificar.
        n_reports_in_section:
          type: integer
          minimum: 0
          description: |
            Número de gaps (report_ids distintos) de oasis de este tipo en la ventana.
            0 si la sección está vacía.
        oasis_coords:
          type: array
          items:
            $ref: "#/components/schemas/TemporalDistributionCoord"
          description: |
            Lista de coordenadas de los oasis distintos de este tipo con al menos un gap
            en la ventana. Derivado de type_oasis_ids[tipo] (ya construido en v3).
            Orden: y ASC, x ASC (determinista para tests).
            [] si n_oasis=0 (sección vacía). Sin cap en v4.
            El frontend formatea como "(-15|23)"; el backend devuelve enteros crudos.
            [NUEVO v4]
        avg_bounty:
          $ref: "#/components/schemas/TemporalDistributionBounty"
          description: |
            Media de botín por reporte de la sección. Ver TemporalDistributionBounty.
            Denominador = n_reports_in_section (incluye derrotas con bounty=0).
            Todos a 0 si n_reports_in_section=0. [NUEVO v4]
        total_animals:
          $ref: "#/components/schemas/TemporalDistributionTotalAnimals"
          description: |
            Distribución del total de animales por reporte en la sección.
            Ver TemporalDistributionTotalAnimals para la regla "todo o nada".
            [NUEVO v4]
        animals:
          type: array
          items:
            $ref: "#/components/schemas/TemporalDistributionAnimalEntry"
          description: |
            Lista de animales con al menos un reporte en esta sección (n_total > 0).
            Orden: animal_ordinal ASC. [] si n_reports_in_section=0.

    TemporalDistributionResponse:
      type: object
      description: |
        Respuesta de EP-TD v3 GET /attack-reports/stats/oasis/temporal-distribution.
        El cliente elige UNA frecuencia de farmeo (interval_minutes) y recibe la
        estadística de la ventana de gaps agrupada por tipo de oasis inferido.
        Requiere Accept-Language (nombres de animal localizados).
        200 siempre; types[] con 5 secciones vacías si la ventana no tiene datos.
        Ver spec docs/specs/bd-ataques-oasis-temporal-distribution.md §8 EP-TD (v3).
      required:
        - interval_minutes
        - interval_label
        - window
        - n_reports_in_window
        - types
      properties:
        interval_minutes:
          type: integer
          enum: [6, 7, 10, 15, 30, 60, 120, 180, 240, 300]
          description: |
            Frecuencia de farmeo solicitada (eco del parámetro; 240 si se usó el default).
        interval_label:
          type: string
          enum: ["6 min", "7 min", "10 min", "15 min", "30 min", "1h", "2h", "3h", "4h", "5h+"]
          description: |
            Etiqueta legible de la frecuencia. El bin 300 lleva "5h+" para indicar
            que la ventana es abierta. Valores fijos por interval_minutes:
            6→"6 min", 7→"7 min", 10→"10 min", 15→"15 min", 30→"30 min",
            60→"1h", 120→"2h", 180→"3h", 240→"4h", 300→"5h+".
        window:
          $ref: "#/components/schemas/TemporalDistributionWindow"
        n_reports_in_window:
          type: integer
          minimum: 0
          description: |
            Número total de gaps en la ventana. Igual a la suma de n_reports_in_section
            de las 5 secciones. Incluye reportes de derrota (present=null). 0 si vacío.
        types:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/TemporalDistributionTypeSection"
          description: |
            Siempre exactamente 5 secciones en orden fijo:
            [0] hierro, [1] arcilla, [2] madera, [3] cereal, [4] sin_clasificar.
            Las secciones sin datos se incluyen con n_oasis=0, n_reports_in_section=0,
            animals=[].

    # ── EP-SPAWN schemas ────────────────────────────────────────────────────

    AttackerPair:
      type: object
      description: Par (jugador, aldea) inferido de los blobs origin_village_name.
      required: [player, village]
      properties:
        player:
          type: string
          description: |
            Nombre del jugador extraído del blob (texto entre el tag de alianza y el
            marcador "from village"). Fallback: "Desconocido".
        village:
          type: string
          description: |
            Nombre de la aldea, canonizado contra la tabla villages si hay coincidencia
            por substring. Fallback: "Desconocido".

    SpawnSpeciesEntry:
      type: object
      description: Composición y peor combinación para una especie concreta de un oasis.
      required:
        - animal_ordinal
        - icon_url
        - avg_present_per_burst
        - max_present_per_burst
        - is_anomaly
        - spawn_timer_s
        - worst_case_count
        - def_infantry_contribution
        - def_cavalry_contribution
      properties:
        animal_ordinal:
          type: integer
          minimum: 1
          maximum: 10
          description: Identificador de la especie (1=rata..10=elefante). El frontend resuelve el nombre vía i18n.
        icon_url:
          type: string
          description: "Ruta del icono: /static/icons/nature_{animal_ordinal}.png"
        avg_present_per_burst:
          type: number
          format: float
          description: |
            Media de present en los reportes donde present > 0 para este animal
            en este oasis. Redondeado a 1 decimal.
        max_present_per_burst:
          type: integer
          minimum: 1
          description: Máximo de present observado en algún reporte de este oasis.
        is_anomaly:
          type: boolean
          description: |
            true si el ordinal no pertenece al set base del inferred_type (animal
            fuera del set normal del tipo de oasis inferido).
        spawn_timer_s:
          type: [integer, "null"]
          description: Timer de spawn en segundos (de SPAWN_TIMER_S). null si el ordinal no está en el catálogo.
        worst_case_count:
          type: [integer, "null"]
          description: |
            Peor combinación: max_present_per_burst + floor(timer_min_s / spawn_timer_s).
            null si inferred_type es null o la especie es anomalía (RN-WORST-05).
        def_infantry_contribution:
          type: [integer, "null"]
          description: worst_case_count × def_infantry del animal. null si worst_case_count es null.
        def_cavalry_contribution:
          type: [integer, "null"]
          description: worst_case_count × def_cavalry del animal. null si worst_case_count es null.

    SpawnWorstCaseSummary:
      type: object
      description: Suma de contribuciones defensivas de todos los animales del set base (sin anomalías).
      required: [def_infantry_total, def_cavalry_total]
      properties:
        def_infantry_total:
          type: integer
          minimum: 0
          description: Suma de def_infantry_contribution de los animales del set (no anomalías).
        def_cavalry_total:
          type: integer
          minimum: 0
          description: Suma de def_cavalry_contribution de los animales del set (no anomalías).

    SpawnOasisEntry:
      type: object
      description: Composición típica, peor combinación y estado de spawn para un oasis.
      required:
        - coord_x_dest
        - coord_y_dest
        - total_attacks
        - last_attack
        - inferred_type
        - confidence
        - spawn_status
        - elapsed_seconds
        - attackers
        - species
        - worst_case_summary
      properties:
        coord_x_dest:
          type: integer
          description: Coordenada X del oasis.
        coord_y_dest:
          type: integer
          description: Coordenada Y del oasis.
        total_attacks:
          type: integer
          minimum: 1
          description: Número total de ataques registrados en BD para este oasis.
        last_attack:
          type: string
          description: |
            attacked_at del último reporte (ISO 8601 naive — hora local Travian, sin zona).
          example: "2026-06-01T22:15:00"
        inferred_type:
          type: [string, "null"]
          enum: ["hierro", "arcilla", "madera", "cereal", null]
          description: |
            Tipo de oasis inferido por similitud de Jaccard sobre los ordinales observados.
            null si el oasis nunca ha mostrado animales (RN-TYP-05).
        confidence:
          type: [string, "null"]
          enum: ["low", "medium", null]
          description: |
            Confianza en la inferencia: "low" (<3 reportes con present>0),
            "medium" (≥3 reportes), null si inferred_type es null (RN-TYP-04/05).
        spawn_status:
          type: string
          enum: ["respawning", "cooldown", "unknown"]
          description: |
            Estado del ciclo de spawn (Pieza 4):
            "respawning" — oasis atacado recientemente, puede estar generando animales;
            "cooldown"   — elapsed_seconds > 4 horas (umbral conservador v1);
            "unknown"    — sin tipo inferido o sin suficientes reportes.
        elapsed_seconds:
          type: number
          format: float
          minimum: 0
          description: |
            Segundos transcurridos entre last_attack (ajustado a UTC con utc_offset)
            y computed_at. Redondeado a 1 decimal. Mínimo 0 (EC-09).
        attackers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AttackerPair"
          description: |
            Lista DISTINCT de pares (player, village) inferidos de los blobs
            origin_village_name. Ordenados por player A-Z, luego village A-Z.
            Nunca vacío: mínimo [{"player":"Desconocido","village":"Desconocido"}]
            si no hay pares extraíbles (RN-ACCT-05).
        species:
          type: array
          items:
            $ref: "#/components/schemas/SpawnSpeciesEntry"
          description: |
            Solo animales con present > 0 alguna vez en este oasis.
            Array vacío si el oasis nunca ha mostrado animales.
        worst_case_summary:
          oneOf:
            - $ref: "#/components/schemas/SpawnWorstCaseSummary"
            - type: "null"
          description: |
            Resumen defensivo del peor caso. null si inferred_type es null (RN-WORST-04).

    SpawnCompositionResponse:
      type: object
      description: |
        Respuesta de EP-SPAWN GET /attack-reports/stats/oasis/spawn-composition.
        Composición típica por oasis, peor combinación a batir para el timer_min dado
        y estado cooldown/respawn. Sin Accept-Language (ordinales; frontend resuelve nombres).
        200 siempre, incluso con oasis: [].
      required:
        - computed_at
        - timer_min
        - oasis
      properties:
        computed_at:
          type: string
          format: date-time
          description: Momento exacto del cálculo en el servidor (ISO 8601 UTC).
        timer_min:
          type: integer
          enum: [6, 7, 10, 15]
          description: Eco del parámetro timer_min recibido (intervalo en minutos).
        oasis:
          type: array
          items:
            $ref: "#/components/schemas/SpawnOasisEntry"
          description: |
            Oasis con reportes en BD, ordenados: tipo inferido primero (null al final),
            luego por last_attack DESC dentro de cada grupo.
            Array vacío si BD sin reportes.

    # -----------------------------------------------------------------------
    # Schemas — Human Sessions
    # -----------------------------------------------------------------------

    SessionBlock:
      type: object
      description: Bloque horario de actividad del bot en un día de la semana.
      required: [start, end, mode]
      properties:
        start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "09:00"
          description: Hora de inicio del bloque (HH:MM).
        end:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$|^24:00$'
          example: "18:00"
          description: Hora de fin del bloque (HH:MM o 24:00).
        mode:
          type: string
          enum: [HARDCORE, PASIVO, DISCONNECTED]
          description: Modo de actividad del bot durante este bloque.

    SessionTimeline:
      type: object
      description: Timeline horario de un día de la semana para un mundo.
      required: [weekday, is_default, jitter_minutes, blocks]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Día de la semana (0=lunes, 6=domingo).
        is_default:
          type: boolean
          description: true si es el timeline por defecto (24h DISCONNECTED); false si fue configurado explícitamente.
        jitter_minutes:
          type: integer
          minimum: 0
          description: Variación aleatoria en minutos aplicada a los bordes de bloque.
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/SessionBlock"
          description: Bloques horarios del día, ordenados por hora de inicio.

    SessionOverride:
      type: object
      description: Override manual de modo activo.
      required: [mode, expires_at]
      properties:
        mode:
          type: string
          enum: [HARDCORE, PASIVO, DISCONNECTED]
        expires_at:
          type: string
          format: date-time
          description: Instante en que expira el override (ISO 8601 UTC).

    SessionStatusResponse:
      type: object
      description: Estado actual de la sesión del bot para un mundo.
      required: [mode, block, jitter_minutes, next_block_ends_at, seconds_to_next_block, override]
      properties:
        mode:
          type: string
          enum: [HARDCORE, PASIVO, DISCONNECTED]
          description: Modo activo en este momento (puede ser el del override si existe).
        block:
          $ref: "#/components/schemas/SessionBlock"
          description: Bloque del calendario que está activo en este momento.
        jitter_minutes:
          type: integer
          minimum: 0
        next_block_ends_at:
          type: string
          format: date-time
          description: Instante en que termina el bloque actual (o el override), ISO 8601 UTC.
        seconds_to_next_block:
          type: integer
          minimum: 0
          description: Segundos hasta el próximo cambio de bloque (calculado en el servidor).
        override:
          $ref: "#/components/schemas/SessionOverride"
          nullable: true
          description: Override activo si existe; null si el modo proviene del calendario.

    SessionModeResponse:
      type: object
      description: Respuesta de PUT /session/mode (override aplicado).
      required: [mode, expires_at, already_active, requires_relogin, chrome_action, message]
      properties:
        mode:
          type: string
          enum: [HARDCORE, PASIVO, DISCONNECTED]
        expires_at:
          type: [string, "null"]
          format: date-time
          nullable: true
          description: Hasta cuándo dura el override. null si already_active=true.
        already_active:
          type: boolean
          description: true si el mundo ya estaba en el modo solicitado (no se escribió en BD).
        requires_relogin:
          type: boolean
          description: true si la transición requiere abrir Chrome desde DISCONNECTED.
        chrome_action:
          type: string
          enum: [none, open, close]
          description: '"open" si hay que abrir Chrome, "close" si hay que cerrarlo, "none" si no cambia.'
        message:
          type: string

    SessionConfigResponse:
      type: object
      description: Parámetros de configuración del modo PASIVO.
      required: [passive_interval_factor, passive_send_probability]
      properties:
        passive_interval_factor:
          type: number
          format: float
          minimum: 1.5
          maximum: 5.0
          description: Multiplicador del intervalo base en modo PASIVO.
        passive_send_probability:
          type: number
          format: float
          minimum: 0.01
          maximum: 0.50
          description: Probabilidad de disparar un envío de farm list en cada ciclo PASIVO.

    # -----------------------------------------------------------------------
    # Schemas — Noise (EP-N01 a EP-N10)
    # -----------------------------------------------------------------------

    NoiseConfigResponse:
      type: object
      description: |
        Configuración de ruido de navegación para un mundo (v2).
        Los campos *_req_per_hour_* fueron sustituidos por *_interval_*_seconds
        (spec noise-frequency-and-destination-weight.md §8.1).
      required:
        - world_id
        - noise_enabled
        - hardcore_interval_min_seconds
        - hardcore_interval_max_seconds
        - passive_interval_min_seconds
        - passive_interval_max_seconds
        - dwell_min_seconds
        - dwell_max_seconds
      properties:
        world_id:
          type: integer
        noise_enabled:
          type: boolean
          description: Si el sistema de ruido de navegación está activo para este mundo.
        hardcore_interval_min_seconds:
          type: integer
          minimum: 30
          description: |
            Intervalo mínimo entre navegaciones de ruido en modo HARDCORE (segundos).
            Piso guardian anti-detección: 30 s. Default: 30 s.
        hardcore_interval_max_seconds:
          type: integer
          minimum: 30
          description: |
            Intervalo máximo entre navegaciones de ruido en modo HARDCORE (segundos).
            Default: 90 s.
        passive_interval_min_seconds:
          type: integer
          minimum: 30
          description: |
            Intervalo mínimo entre navegaciones de ruido en modo PASIVO (segundos).
            Default: 180 s.
        passive_interval_max_seconds:
          type: integer
          minimum: 30
          description: |
            Intervalo máximo entre navegaciones de ruido en modo PASIVO (segundos).
            Default: 1200 s.
        dwell_min_seconds:
          type: number
          format: float
          minimum: 0
          description: Tiempo mínimo de permanencia en una página de destino (segundos).
        dwell_max_seconds:
          type: number
          format: float
          minimum: 0

    NoiseDestinationResponse:
      type: object
      description: |
        Destino de navegación de ruido (URL a visitar periódicamente).
        v2: frequency_weight se expone como navigation_weight en el contrato
        (spec noise-frequency-and-destination-weight.md §8.3-8.5, RN-FW06).
      required:
        - id
        - world_id
        - url_pattern
        - label
        - category
        - navigation_weight
        - is_safe
        - is_dead
        - consecutive_failures_count
      properties:
        id:
          type: integer
        world_id:
          type: integer
        url_pattern:
          type: string
          description: Patrón de URL del destino (absoluta o relativa /...).
        label:
          type: string
          description: Etiqueta descriptiva del destino.
        category:
          type: string
          description: Categoría del destino (enum NoiseCategory).
        navigation_weight:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
          description: |
            Peso de navegación del destino. Mayor peso = se visita más frecuentemente.
            Rango: [0.1, 5.0] (guardian anti-detección: pesos extremos generan patrones predecibles).
            Default: 1.0. Alias de frequency_weight en la entidad interna.
        is_safe:
          type: boolean
          description: true si el destino es seguro para visitar (no alerta a Travian).
        is_dead:
          type: boolean
          description: true si el destino fue marcado como muerto por fallos consecutivos.
        consecutive_failures_count:
          type: integer
          minimum: 0
        created_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    NavigationStepResponse:
      type: object
      description: Un paso de una ruta de navegación de ruido.
      required: [step_order, action, selector, value, delay_min_ms, delay_max_ms]
      properties:
        id:
          type: [integer, "null"]
        path_id:
          type: [integer, "null"]
        step_order:
          type: integer
          minimum: 0
        action:
          type: string
          description: Tipo de acción (CLICK, WAIT_FOR_SELECTOR, etc.).
        selector:
          type: string
          description: Selector CSS estructural del paso.
        value:
          type: string
          description: Valor adicional para la acción (vacío si no aplica).
        delay_min_ms:
          type: integer
          minimum: 0
        delay_max_ms:
          type: integer
          minimum: 0
        expected_url_after_click:
          type: [string, "null"]
          description: URL o path esperado tras el click. null si no aplica o no es CLICK.

    NavigationPathResponse:
      type: object
      description: Ruta de navegación de ruido con todos sus pasos.
      required: [id, destination_id, origin, label, is_active, is_dead, consecutive_failures_count, steps]
      properties:
        id:
          type: integer
        destination_id:
          type: integer
        origin:
          type: string
          description: "Origen de la ruta: valor del enum NavigationOrigin (ej. 'STATISTICS') o 'VILLAGE_<data_id>'."
        label:
          type: string
        is_active:
          type: boolean
        is_dead:
          type: boolean
        consecutive_failures_count:
          type: integer
          minimum: 0
        steps:
          type: array
          items:
            $ref: "#/components/schemas/NavigationStepResponse"
          description: Pasos de la ruta ordenados por step_order ASC.

paths:
  /attack-reports/stats/global:
    get:
      summary: Estadísticas globales de todos los oasis combinados (EP-09)
      description: |
        Devuelve estadísticas agregadas de aparición de animales y tasas de regeneración
        para todos los oasis conocidos en BD. Sin filtros, sin parámetros de entrada.

        El campo `eligible_reports` de cada item de `animal_appearances[]` es el denominador
        semánticamente correcto del % de aparición: número de reportes que pertenecen a oasis
        donde esa especie ha aparecido alguna vez. Permite calcular
        `appearances / eligible_reports × 100` en el frontend sin dilución por oasis irrelevantes.

        Sin Accept-Language (datos numéricos; animal_name es texto crudo del usuario).
        Siempre devuelve 200, incluso con BD vacía (arrays vacíos).

        Ver spec docs/specs/bd-ataques-oasis-global-pct-aparicion.md §8.
      operationId: get_global_oasis_stats
      tags:
        - attack-reports
      responses:
        "200":
          description: Estadísticas globales calculadas (incluso si BD vacía)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalOasisStatsResponse"
              examples:
                con_datos:
                  summary: Con datos (ejemplo numérico de referencia del spec)
                  value:
                    scope: "global"
                    animal_appearances:
                      - animal_ordinal: 1
                        animal_name: "Rat"
                        appearances: 8
                        eligible_reports: 15
                        avg_present: 7.50
                        max_present: 15
                        min_present: 3
                      - animal_ordinal: 2
                        animal_name: "Spider"
                        appearances: 4
                        eligible_reports: 4
                        avg_present: 4.33
                        max_present: 9
                        min_present: 2
                    animal_regen_rates:
                      - animal_ordinal: 1
                        animal_name: "Rat"
                        avg_regen_per_hour: 3.45
                        valid_intervals: 18
                bd_vacia:
                  summary: BD vacía
                  value:
                    scope: "global"
                    animal_appearances: []
                    animal_regen_rates: []
        "500":
          description: Error inesperado de BD
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "Error interno al calcular las estadísticas globales."

  /attack-reports/stats/oasis/comparison:
    get:
      summary: Comparativa de tasas de reaparición por oasis (EP-10)
      description: |
        Devuelve la tasa bruta de reaparición de animales y la proyección del número
        acumulado en el momento de la petición, para todos los oasis conocidos en BD.

        Sin parámetros de entrada. Sin Accept-Language (datos numéricos + animal_name crudo).
        Siempre devuelve 200, incluso con BD vacía (oasis: [], species_columns: []).

        Ver spec docs/specs/reaparicion-animales-oasis.md §8.
      operationId: get_oasis_regen_comparison
      tags:
        - attack-reports
      responses:
        "200":
          description: Comparativa calculada correctamente (incluso si BD vacía)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OasisComparisonResponse"
              examples:
                con_datos:
                  summary: Con oasis y tasas calculadas
                  value:
                    computed_at: "2026-06-01T12:34:56.789012+00:00"
                    species_columns:
                      - { animal_ordinal: 1, animal_name: "Rat", icon_url: "/static/icons/nature_1.png" }
                      - { animal_ordinal: 7, animal_name: "Tiger", icon_url: "/static/icons/nature_7.png" }
                    oasis:
                      - coord_x_dest: -70
                        coord_y_dest: 73
                        total_attacks: 8
                        last_attack: "2026-05-30T20:15:00"
                        hours_since_last_attack: 16.3
                        has_rates: true
                        species:
                          - animal_ordinal: 7
                            animal_name: "Tiger"
                            icon_url: "/static/icons/nature_7.png"
                            avg_regen_per_hour: 1.25
                            valid_intervals: 6
                            last_survived: 3
                            projected_now: 23
                      - coord_x_dest: 12
                        coord_y_dest: -45
                        total_attacks: 1
                        last_attack: "2026-05-28T10:00:00"
                        hours_since_last_attack: 50.6
                        has_rates: false
                        species: []
                bd_vacia:
                  summary: BD vacía
                  value:
                    computed_at: "2026-06-01T12:34:56.789012+00:00"
                    species_columns: []
                    oasis: []
        "500":
          description: Error inesperado de BD
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "Error interno al calcular la comparativa de oasis."

  # ---------------------------------------------------------------------------
  # EP-SPAWN — Composición, peor combinación e inferencia de tipo por oasis
  # ---------------------------------------------------------------------------
  /attack-reports/stats/oasis/spawn-composition:
    get:
      summary: Composición de spawn, peor combinación a batir y estado cooldown/respawn por oasis (EP-SPAWN)
      description: |
        Calcula, para todos los oasis con reportes en BD:

        1. **Composición típica** (Pieza 2): promedio y máximo de animales presentes por
           especie por oasis, usando solo los reportes donde `present > 0`.
        2. **Peor combinación a batir** (Pieza 3): dado un `timer_min`, calcula cuántos
           animales pueden acumularse entre dos envíos consecutivos
           (`max_present_per_burst + floor(timer_s / spawn_timer_s)`) y la fuerza
           defensiva total resultante para el set base del oasis.
        3. **Estado cooldown/respawn** (Pieza 4): clasifica cada oasis como "respawning"
           (atacado recientemente, generando animales), "cooldown" (inactivo > 4 horas)
           o "unknown" (sin tipo inferido o sin datos suficientes).

        El tipo de oasis se infiere empíricamente mediante similitud de Jaccard sobre
        los ordinales de animales observados con `present > 0`. Los nombres de animal
        **no se devuelven**: el cliente los resuelve con el ordinal vía i18n
        (`NATURE_{ordinal}` en `core/i18n/catalog/base/troops.json`).

        Los atacantes por oasis (`attackers`) se extraen post-hoc de los blobs
        `origin_village_name` (algoritmo §4.7 v2.6 del spec), sin tocar el parser ni
        columnas de BD. Permite agrupar en el frontend: Jugador → Aldea → Oasis.

        Sin `Accept-Language`. Sin prefijo `/api`.
        200 siempre, incluso con `oasis: []` (BD vacía).

        Ver spec `docs/specs/oasis-spawn-mechanics-stats.md` §8 EP-SPAWN.
      operationId: get_oasis_spawn_composition
      tags:
        - attack-reports
      parameters:
        - name: timer_min
          in: query
          required: true
          schema:
            type: integer
