  # ---------------------------------------------------------------------------
  # EP-N11 — Derivar selector CSS estructural desde outerHTML
  # ---------------------------------------------------------------------------
  /worlds/{world_id}/noise/derive-selector:
    post:
      tags: [noise]
      summary: "EP-N11 — Derivar selector CSS estructural desde outerHTML"
      description: |
        Analiza el outerHTML de un elemento HTML y devuelve el mejor selector CSS
        estructural según la heurística priorizada de RN-NP05.

        No persiste nada — es un endpoint de preview para el wizard de rutas.

        is_unique=True es heurístico: el selector es estable según la heurística
        sobre el fragmento HTML proporcionado. No garantiza unicidad en el
        documento real de Travian. La verificación definitiva es en runtime via
        expected_url_after_click.

        Spec noise-path-wizard.md §8.1 / RN-NP05.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: ID del mundo (debe existir).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outer_html]
              properties:
                outer_html:
                  type: string
                  minLength: 1
                  description: |
                    HTML completo del elemento (obtenido con 'Copiar outerHTML' en DevTools).
                    Máximo 50 KB.
            example:
              outer_html: '<a href="/statistics" class="nav-link">Estadísticas</a>'
      responses:
        "200":
          description: Selector derivado correctamente.
          content:
            application/json:
              schema:
                type: object
                required: [selector, is_unique, priority_level, method, warning, alternatives]
                properties:
                  selector:
                    type: string
                    description: Selector CSS estructural recomendado.
                  is_unique:
                    type: boolean
                    description: |
                      True si el selector se considera único en el fragmento analizado
                      (heurístico — no garantiza unicidad en el documento real de Travian).
                  priority_level:
                    type: integer
                    minimum: 1
                    maximum: 9
                    description: "Nivel de prioridad: 1=id, 2=name, 3=gid, 4=href_exact, 5=href_partial, 6=data_attr, 7=class_combo, 9=fallback."
                  method:
                    type: string
                    enum: [id, name, gid, href_exact, href_partial, data_attr, class_combo, context_combo, fallback]
                    description: Método de derivación usado.
                  warning:
                    type: [string, "null"]
                    description: Aviso si is_unique=False o el selector tiene limitaciones.
                  alternatives:
                    type: array
                    items: { type: string }
                    description: Selectores alternativos (puede estar vacío).
              examples:
                id_valido:
                  value:
                    selector: "#statistics"
                    is_unique: true
                    priority_level: 1
                    method: "id"
                    warning: null
                    alternatives: []
                clases_css:
                  value:
                    selector: "a.nav-link.statistics"
                    is_unique: false
                    priority_level: 7
                    method: "class_combo"
                    warning: "Selector basado en clases CSS. Puede no ser único en el documento real de Travian."
                    alternatives: ["a.nav-link"]
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Mundo no encontrado." }
        "422":
          description: "outer_html vacío, malformado o excede 50 KB."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              examples:
                vacio:
                  value: { detail: "outer_html no puede estar vacío." }
                malformado:
                  value: { detail: "El outerHTML no pudo parsearse como HTML válido." }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Error interno del servidor." }

  # ---------------------------------------------------------------------------
  # EP-N12 — Listar anclas semilla disponibles como origen de ruta
  # ---------------------------------------------------------------------------
  /worlds/{world_id}/noise/origins:
    get:
      tags: [noise]
      summary: "EP-N12 — Listar anclas semilla disponibles como origen de ruta"
      description: |
        Devuelve las anclas semilla para usar como `origin` al crear rutas de ruido:

        - generic_origins: las 9 anclas genéricas fijas del sistema (DORF1, DORF2, MAP,
          STATISTICS, REPORTS, MESSAGES, VILLAGE_STATISTICS, OASIS_VIEW, ANY).
        - village_origins: una ancla por cada aldea en la tabla villages del mundo.
          Vacía si el parser del village-switcher nunca se ha ejecutado.
        - villages_loaded: false si la tabla villages está vacía para este mundo.
          Ejecutar EP-N13 para poblarla.

        Cache-Control: no-store.
        Spec noise-path-wizard.md §8.2 / RN-NP01 / RN-NP02.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: ID del mundo.
      responses:
        "200":
          description: Lista de anclas semilla.
          headers:
            Cache-Control:
              schema: { type: string }
              example: "no-store"
          content:
            application/json:
              schema:
                type: object
                required: [generic_origins, village_origins, villages_loaded]
                properties:
                  generic_origins:
                    type: array
                    description: Las 9 anclas genéricas fijas del sistema.
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value:
                          type: string
                          description: Valor del enum NavigationOrigin.
                        label:
                          type: string
                          description: Etiqueta descriptiva en español.
                        path:
                          type: [string, "null"]
                          description: Ruta relativa de Travian. Null para ANY.
                  village_origins:
                    type: array
                    description: Anclas por-aldea generadas desde la tabla villages.
                    items:
                      type: object
                      required: [value, label, data_id, x, y, path]
                      properties:
                        value:
                          type: string
                          description: "'VILLAGE_<data_id>'"
                        label:
                          type: string
                          description: Nombre de la aldea.
                        data_id:
                          type: integer
                          description: Identificador de la aldea (newdid en Travian).
                        x:
                          type: integer
                        y:
                          type: integer
                        path:
                          type: string
                          description: "'/dorf1.php?newdid=<data_id>'"
                  villages_loaded:
                    type: boolean
                    description: True si villages tiene datos para este mundo.
              example:
                generic_origins:
                  - { value: "DORF1",              label: "Recursos (aldea activa)",      path: "/dorf1.php" }
                  - { value: "DORF2",              label: "Edificios (aldea activa)",     path: "/dorf2.php" }
                  - { value: "MAP",                label: "Mapa mundial",                  path: "/karte.php" }
                  - { value: "STATISTICS",         label: "Estadísticas globales",         path: "/statistics" }
                  - { value: "REPORTS",            label: "Reportes",                      path: "/report" }
                  - { value: "MESSAGES",           label: "Mensajes",                      path: "/messages" }
                  - { value: "VILLAGE_STATISTICS", label: "Estadísticas de aldea",         path: "/village/statistics" }
                  - { value: "OASIS_VIEW",         label: "Vista oasis en el mapa",        path: "/karte.php" }
                  - { value: "ANY",                label: "Cualquier página (sin ancla)",  path: null }
                village_origins:
                  - { value: "VILLAGE_12345", label: "Merlinia", data_id: 12345, x: 42, y: -17, path: "/dorf1.php?newdid=12345" }
                villages_loaded: true
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Mundo no encontrado." }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Error interno del servidor." }

  # ---------------------------------------------------------------------------
  # EP-N13 — Refrescar aldeas del village-switcher
  # ---------------------------------------------------------------------------
  /worlds/{world_id}/noise/refresh-villages:
    post:
      tags: [noise]
      summary: "EP-N13 — Refrescar aldeas del village-switcher de Travian"
      description: |
        Instruye al WorldAgent del mundo a ejecutar el parser del village-switcher
        de Travian y actualizar la tabla villages con las aldeas propias.

        Requisitos:
        - El mundo debe existir (404 si no).
        - El WorldAgent debe estar RUNNING (409 si DISCONNECTED o no iniciado).

        El parser solo lee el DOM (tab.evaluate), sin clicks ni navegación.
        Operación síncrona — espera a que el parser complete antes de responder.
        Las aldeas existentes no se borran (UPSERT). Las que dejan de aparecer
        se mantienen en BD (anti-detección: el bot no reacciona en caliente).

        Spec noise-path-wizard.md §8.3 / RN-NP03.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: ID del mundo.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Body vacío o {} — no se procesa ningún campo.
      responses:
        "200":
          description: Parser ejecutado. Devuelve la lista de aldeas encontradas.
          content:
            application/json:
              schema:
                type: object
                required: [villages_found, villages_data]
                properties:
                  villages_found:
                    type: integer
                    minimum: 0
                    description: Número de aldeas encontradas y upserteadas.
                  villages_data:
                    type: array
                    description: Lista de aldeas actualizadas.
                    items:
                      type: object
                      required: [data_id, name, x, y]
                      properties:
                        data_id: { type: integer }
                        name: { type: string }
                        x: { type: integer }
                        y: { type: integer }
              example:
                villages_found: 2
                villages_data:
                  - { data_id: 12345, name: "Merlinia", x: 42, y: -17 }
                  - { data_id: 12346, name: "Forticia",  x: 43, y: -17 }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Mundo no encontrado." }
        "409":
          description: El WorldAgent está desconectado o no ha sido iniciado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "El agente del mundo está desconectado. Inicia sesión primero para poder refrescar las aldeas." }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Error interno del servidor." }

  # EP-N14 — Probar ruta de navegación en vivo
  # ---------------------------------------------------------------------------
  /worlds/{world_id}/noise/paths/{path_id}/test:
    post:
      tags: [noise]
      summary: "EP-N14 — Probar ruta de navegación en vivo"
      description: |
        Ejecuta la ruta de navegación indicada en el Chrome real del bot y devuelve
        un reporte paso a paso del resultado.

        El test es NO DESTRUCTIVO: no modifica contadores de fallos, no marca rutas
        como is_dead, no actualiza last_used_at y no ejecuta el dwell final.
        Su único propósito es diagnóstico — permite al usuario verificar que una
        ruta funciona antes de dejarla en producción.

        IMPORTANTE: HTTP 200 tanto si la ruta pasó (overall="ok") como si falló
        (overall="error"). El fallo es semántico; el endpoint se ejecutó
        correctamente en ambos casos.

        El browser queda en la última página visitada durante el test (RN-PT06).

        Requiere que el WorldAgent del mundo esté activo (AgentState.RUNNING).
        Devuelve 409 si el agente está desconectado o el browser está ocupado
        con otra tarea (ejecutando ruido o refresh-villages).

        Sin body: la ruta a probar se identifica por path_id en la URL.
        Sin Accept-Language: el reporte no contiene texto localizable.

        Spec noise-path-wizard.md §16.8 (EP-N14).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: ID del mundo.
        - name: path_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: ID de la ruta de navegación a probar.
      responses:
        "200":
          description: |
            Test ejecutado. overall="ok" si todos los pasos pasaron; "error" si
            alguno falló (el endpoint ejecutó correctamente en ambos casos).
          content:
            application/json:
              schema:
                type: object
                required: [overall, aborted_at_step, anchor_navigated_to, steps, browser_note]
                properties:
                  overall:
                    type: string
                    enum: [ok, error]
                    description: '"ok" si todos los pasos tuvieron éxito; "error" si alguno falló.'
                  aborted_at_step:
                    type: integer
                    nullable: true
                    description: step_order del paso donde abortó el test. null si overall=="ok".
                  anchor_navigated_to:
                    type: string
                    nullable: true
                    description: URL del ancla de origen antes del primer paso. null si origin=="ANY".
                  steps:
                    type: array
                    description: Resultados de los pasos ejecutados (solo los intentados).
                    items:
                      type: object
                      required: [step_order, action, selector, status]
                      properties:
                        step_order:
                          type: integer
                          description: Índice del paso (igual que NavigationStep.step_order).
                        action:
                          type: string
                          description: Tipo de acción ejecutada (CLICK, WAIT_FOR_SELECTOR, etc.).
                        selector:
                          type: string
                          description: Selector CSS del paso.
                        status:
                          type: string
                          enum: [ok, error]
                          description: '"ok" si el paso se ejecutó con éxito; "error" si falló.'
                        reason:
                          type: string
                          nullable: true
                          description: Motivo del fallo. null si status=="ok".
                        current_url:
                          type: string
                          nullable: true
                          description: URL del tab TRAS ejecutar el paso. null si no se pudo leer.
                  browser_note:
                    type: string
                    description: Aviso fijo sobre el estado del browser tras el test.
              examples:
                ruta_ok:
                  summary: Ruta ejecutada con éxito
                  value:
                    overall: "ok"
                    aborted_at_step: null
                    anchor_navigated_to: "https://ts1.travian.es/statistics"
                    steps:
                      - step_order: 0
                        action: "CLICK"
                        selector: "a[href='/statistics']"
                        status: "ok"
                        reason: null
                        current_url: "https://ts1.travian.es/statistics"
                    browser_note: "El browser queda en la última página visitada durante el test."
                ruta_con_fallo:
                  summary: Ruta con paso fallido (HTTP 200, overall error)
                  value:
                    overall: "error"
                    aborted_at_step: 1
                    anchor_navigated_to: "https://ts1.travian.es/statistics"
                    steps:
                      - step_order: 0
                        action: "CLICK"
                        selector: "a[href='/statistics']"
                        status: "ok"
                        reason: null
                        current_url: "https://ts1.travian.es/statistics"
                      - step_order: 1
                        action: "CLICK"
                        selector: "a[href*='gid=2']"
                        status: "error"
                        reason: "elemento no encontrado en el DOM"
                        current_url: "https://ts1.travian.es/statistics"
                    browser_note: "El browser queda en la última página visitada durante el test."
                ruta_sin_pasos:
                  summary: Ruta sin pasos (always ok)
                  value:
                    overall: "ok"
                    aborted_at_step: null
                    anchor_navigated_to: "https://ts1.travian.es/statistics"
                    steps: []
                    browser_note: "El browser queda en la última página visitada durante el test."
        "404":
          description: Mundo o ruta no encontrados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              examples:
                mundo_no_encontrado:
                  value: { detail: "Mundo no encontrado." }
                ruta_no_encontrada:
                  value: { detail: "Ruta no encontrada." }
        "409":
          description: |
            El WorldAgent está desconectado, no ha sido iniciado para este mundo,
            o el browser está ocupado con otra tarea (ruido en ejecución o
            refresh-villages en curso).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              examples:
                agente_desconectado:
                  value: { detail: "El agente del mundo está desconectado. Inicia sesión primero para poder probar la ruta." }
                browser_ocupado:
                  value: { detail: "El browser está ocupado con otra tarea. Espera a que finalice e inténtalo de nuevo." }
        "500":
          description: Error interno del servidor (browser no disponible, servidor del mundo no accesible, etc.).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Error interno del servidor." }

  # ---------------------------------------------------------------------------
  # Human Sessions — EP-HS01 a EP-HS08
  # ---------------------------------------------------------------------------

  /worlds/{world_id}/session:
    get:
      tags: [session]
      summary: "EP-HS01 — Estado actual de la sesión del bot"
      description: |
        Devuelve el modo activo en este momento (HARDCORE, PASIVO o DISCONNECTED),
        el bloque del calendario en curso, el jitter configurado para el día y el
        tiempo en segundos hasta el próximo cambio de modo.
        Si hay un override activo lo devuelve en el campo override; si no, null.
        Sin Accept-Language: no devuelve texto localizado.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Estado actual de la sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatusResponse' }
              example:
                mode: "HARDCORE"
                block: { start: "08:00", end: "11:00", mode: "HARDCORE" }
                jitter_minutes: 15
                next_block_ends_at: "2026-05-30T10:53:00Z"
                seconds_to_next_block: 4692
                override: null
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
              example: { detail: "Mundo no encontrado." }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/session/timeline:
    get:
      tags: [session]
      summary: "EP-HS02 — Timeline completo (7 días de la semana)"
      description: |
        Devuelve los 7 timelines, uno por día de la semana (0=lunes..6=domingo).
        Los días sin configuración explícita devuelven is_default=true con el
        timeline por defecto (24h DISCONNECTED).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Timelines de los 7 días.
          content:
            application/json:
              schema:
                type: object
                required: [timelines]
                properties:
                  timelines:
                    type: array
                    items: { $ref: '#/components/schemas/SessionTimeline' }
                    minItems: 7
                    maxItems: 7
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/session/timeline/{weekday}:
    put:
      tags: [session]
      summary: "EP-HS03 — Reemplazar timeline de un día"
      description: |
        Reemplaza los bloques del día indicado. Los huecos entre bloques se rellenan
        automáticamente con DISCONNECTED. Los bloques solapados producen 422.
        El campo jitter_minutes controla la variación aleatoria en los bordes del bloque.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: weekday
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 6 }
          description: Día de la semana (0=lunes, 6=domingo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                blocks:
                  type: array
                  items:
                    type: object
                    required: [start, end, mode]
                    properties:
                      start: { type: string, example: "09:00" }
                      end:   { type: string, example: "18:00" }
                      mode:  { type: string, enum: [HARDCORE, PASIVO, DISCONNECTED] }
                jitter_minutes:
                  type: integer
                  minimum: 0
                  default: 15
            example:
              jitter_minutes: 15
              blocks:
                - start: "09:00"
                  end: "18:00"
                  mode: "HARDCORE"
      responses:
        "200":
          description: Timeline guardado (con huecos rellenados como DISCONNECTED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTimeline' }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: Bloques solapados, weekday fuera de rango, formato de hora inválido o modo desconocido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/session/mode:
    put:
      tags: [session]
      summary: "EP-HS04 — Override manual de modo"
      description: |
        Fuerza un modo hasta el próximo borde de bloque del calendario.
        Idempotente: si el mundo ya está en el modo solicitado, devuelve
        already_active=true sin escribir en BD.
        La tabla de transiciones determina chrome_action y requires_relogin:
          - DISCONNECTED → otro: chrome_action=open, requires_relogin=true
          - otro → DISCONNECTED: chrome_action=close
          - mismo nivel o distinto sin cambio de Chrome: chrome_action=none
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [HARDCORE, PASIVO, DISCONNECTED]
            example:
              mode: "PASIVO"
      responses:
        "200":
          description: Override aplicado (o already_active=true si ya estaba en ese modo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionModeResponse' }
              examples:
                override_aplicado:
                  value:
                    mode: "PASIVO"
                    expires_at: "2026-05-30T11:08:00Z"
                    already_active: false
                    requires_relogin: false
                    chrome_action: "none"
                    message: "Override applied. Takes effect on the next WorldAgent cycle."
                ya_activo:
                  value:
                    mode: "PASIVO"
                    expires_at: null
                    already_active: true
                    requires_relogin: false
                    chrome_action: "none"
                    message: "World already in PASIVO mode. No changes made."
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: mode no reconocido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/session/override:
    delete:
      tags: [session]
      summary: "EP-HS05 — Cancelar override de modo activo"
      description: |
        Borra el override de modo activo para el mundo. Tras la llamada, el WorldAgent
        recupera el modo que dicte el calendario en su próximo ciclo.
        Idempotente: si no hay override activo, responde igualmente 204.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Override cancelado (o no existía, ambos casos devuelven 204).
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/session/config:
    get:
      tags: [session]
      summary: "EP-HS06 — Leer configuración del modo PASIVO"
      description: |
        Devuelve los parámetros de configuración del modo PASIVO.
        Si el mundo no tiene configuración explícita, devuelve los defaults
        (passive_interval_factor=2.0, passive_send_probability=0.05).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Configuración del modo PASIVO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionConfigResponse' }
              example:
                passive_interval_factor: 2.0
                passive_send_probability: 0.05
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    put:
      tags: [session]
      summary: "EP-HS07 — Actualizar configuración del modo PASIVO (PATCH parcial)"
      description: |
        Actualiza uno o ambos parámetros del modo PASIVO. Semántica PATCH parcial:
        los campos no enviados conservan su valor actual (o el default si nunca fue configurado).
        El body debe contener al menos uno de los dos campos.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passive_interval_factor:
                  type: number
                  format: float
                  minimum: 1.5
                  maximum: 5.0
                  nullable: true
                  description: "Multiplicador del intervalo en PASIVO. Rango [1.5, 5.0]."
                passive_send_probability:
                  type: number
                  format: float
                  minimum: 0.01
                  maximum: 0.50
                  nullable: true
                  description: "Probabilidad de disparo en PASIVO. Rango [0.01, 0.50]."
            example:
              passive_interval_factor: 3.0
      responses:
        "200":
          description: Configuración actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionConfigResponse' }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: |
            passive_interval_factor fuera de [1.5, 5.0];
            passive_send_probability fuera de [0.01, 0.50];
            o ningún campo enviado en el body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  # ---------------------------------------------------------------------------
  # Noise — EP-N01 a EP-N10
  # ---------------------------------------------------------------------------

  /worlds/{world_id}/noise/config:
    get:
      tags: [noise]
      summary: "EP-N01 — Leer configuración de ruido del mundo"
      description: |
        Devuelve la configuración de ruido del mundo.
        Si el mundo no tiene configuración previa, la crea con valores por defecto
        y la persiste (get_or_create).
        Cache-Control: no-store (la config cambia frecuentemente).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Configuración de ruido del mundo.
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoiseConfigResponse' }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    put:
      tags: [noise]
      summary: "EP-N02 — Actualizar configuración de ruido (PATCH parcial)"
      description: |
        PATCH parcial de la configuración de ruido. Solo actualiza los campos presentes;
        el resto conserva su valor. El body debe contener al menos un campo.
        Validaciones cruzadas: max >= min para cada par min/max.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                v2: campos *_req_per_hour_* eliminados; reemplazados por *_interval_*_seconds.
                Piso guardian: >= 30 s para cualquier campo de intervalo (anti-detección).
              properties:
                noise_enabled:
                  type: boolean
                  nullable: true
                hardcore_interval_min_seconds:
                  type: integer
                  minimum: 30
                  nullable: true
                  description: "Piso 30 s (guardian anti-detección)."
                hardcore_interval_max_seconds:
                  type: integer
                  minimum: 30
                  nullable: true
                passive_interval_min_seconds:
                  type: integer
                  minimum: 30
                  nullable: true
                passive_interval_max_seconds:
                  type: integer
                  minimum: 30
                  nullable: true
                dwell_min_seconds:
                  type: number
                  format: float
                  minimum: 0
                  nullable: true
                dwell_max_seconds:
                  type: number
                  format: float
                  minimum: 0
                  nullable: true
            example:
              hardcore_interval_min_seconds: 300
              hardcore_interval_max_seconds: 440
      responses:
        "200":
          description: Configuración actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoiseConfigResponse' }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: |
            max < min en algún par; ningún campo enviado; o campo fuera de rango.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/noise/destinations:
    get:
      tags: [noise]
      summary: "EP-N03 — Listar destinos de ruido del mundo"
      description: |
        Lista los destinos de navegación de ruido del mundo.
        Filtros opcionales: category, include_dead (false por defecto),
        include_unsafe (false por defecto). Paginación: limit/offset.
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: Filtrar por categoría (enum NoiseCategory). Omitir para todas.
        - name: include_dead
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: include_unsafe
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Lista de destinos (paginada).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NoiseDestinationResponse' }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    post:
      tags: [noise]
      summary: "EP-N04 — Crear destino de ruido"
      description: |
        Crea un nuevo destino de navegación de ruido para el mundo.
        Valida que url_pattern sea http/https o ruta relativa (/...).
        El dominio debe pertenecer al servidor del mundo (RN-HS23).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url_pattern, label, category]
              properties:
                url_pattern:
                  type: string
                  minLength: 1
                  description: URL del destino (absoluta o relativa).
                label:
                  type: string
                  minLength: 1
                  description: Etiqueta descriptiva.
                category:
                  type: string
                  description: Categoría del destino (enum NoiseCategory).
                navigation_weight:
                  type: number
                  format: float
                  minimum: 0.1
                  maximum: 5.0
                  default: 1.0
                  description: |
                    Peso de navegación. Alias de frequency_weight (entidad interna).
                    Rango: [0.1, 5.0] (guardian anti-detección RN-FW07).
                is_safe:
                  type: boolean
                  default: true
            example:
              url_pattern: "/statistics"
              label: "Estadísticas globales"
              category: "STATISTICS"
              navigation_weight: 1.0
              is_safe: true
      responses:
        "201":
          description: Destino creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoiseDestinationResponse' }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: URL inválida, dominio incorrecto, o campo fuera de rango.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/noise/destinations/{dest_id}:
    put:
      tags: [noise]
      summary: "EP-N05 — Actualizar destino de ruido (PATCH parcial)"
      description: |
        PATCH parcial del destino. Solo se pueden cambiar label, navigation_weight
        e is_safe. url_pattern y category son inmutables.
        Verifica que dest_id pertenece al world_id (404 si no).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: dest_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  nullable: true
                navigation_weight:
                  type: number
                  format: float
                  minimum: 0.1
                  maximum: 5.0
                  nullable: true
                  description: |
                    Peso de navegación. Alias de frequency_weight (entidad interna).
                    Rango: [0.1, 5.0] (guardian RN-FW07).
                is_safe:
                  type: boolean
                  nullable: true
      responses:
        "200":
          description: Destino actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoiseDestinationResponse' }
        "404":
          description: Mundo no encontrado o destino no encontrado (o de otro mundo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: Ningún campo enviado o campo fuera de rango.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    delete:
      tags: [noise]
      summary: "EP-N06 — Borrar destino de ruido"
      description: |
        Borra el destino y en cascada sus rutas y pasos.
        Verifica que dest_id pertenece al world_id (404 si no).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: dest_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Destino borrado.
        "404":
          description: Mundo no encontrado o destino no encontrado (o de otro mundo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/noise/destinations/{dest_id}/paths:
    get:
      tags: [noise]
      summary: "EP-N07 — Listar rutas de un destino"
      description: |
        Lista todas las rutas del destino, con sus pasos ordenados por step_order ASC.
        Verifica que dest_id pertenece al world_id (404 si no).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: dest_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Lista de rutas del destino.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NavigationPathResponse' }
        "404":
          description: Mundo no encontrado o destino no encontrado (o de otro mundo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    post:
      tags: [noise]
      summary: "EP-N08 — Crear ruta de navegación para un destino"
      description: |
        Crea una nueva ruta con sus pasos para el destino indicado.
        Verifica que dest_id pertenece al world_id (404 si no).
        origin puede ser un valor de NavigationOrigin (ej. 'STATISTICS') o
        'VILLAGE_<data_id>' para anclas por-aldea.
        Restricciones anti-detección: delay_min_ms >= 300 ms, delay_max_ms <= 5000 ms.
        Los selectores no pueden usar :contains() ni text() (no estructurales).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: dest_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, label, steps]
              properties:
                origin:
                  type: string
                  minLength: 1
                  description: "Origen: valor de NavigationOrigin (ej. 'STATISTICS') o 'VILLAGE_<data_id>'."
                label:
                  type: string
                  minLength: 1
                steps:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [step_order, action, selector]
                    properties:
                      step_order:      { type: integer, minimum: 0 }
                      action:          { type: string }
                      selector:        { type: string, minLength: 1 }
                      value:           { type: string, default: "" }
                      delay_min_ms:    { type: integer, minimum: 300, default: 500 }
                      delay_max_ms:    { type: integer, maximum: 5000, default: 900 }
                      expected_url_after_click: { type: string, nullable: true }
            example:
              origin: "STATISTICS"
              label: "Ir a estadísticas desde mapa"
              steps:
                - step_order: 0
                  action: "CLICK"
                  selector: "a[href='/statistics']"
                  delay_min_ms: 500
                  delay_max_ms: 900
                  expected_url_after_click: "/statistics"
      responses:
        "201":
          description: Ruta creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavigationPathResponse' }
        "404":
          description: Mundo no encontrado o destino no encontrado (o de otro mundo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: |
            origin inválido (no en NavigationOrigin ni patrón VILLAGE_); steps vacío;
            delay_min_ms < 300; delay_max_ms > 5000; selector con :contains() o text();
            delay_max_ms < delay_min_ms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/noise/paths/{path_id}:
    put:
      tags: [noise]
      summary: "EP-N09 — Actualizar ruta de navegación (híbrido PATCH/reemplazo de steps)"
      description: |
        Actualización híbrida de una ruta:
          - label e is_active: PATCH parcial (se actualizan si presentes).
          - steps: si se pasa → reemplazo atómico completo; si null → se conservan los actuales.
          - steps=[] no está permitido; para borrar la ruta usa DELETE.
        Verifica que path_id pertenece al world_id (404 si no).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: path_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  nullable: true
                is_active:
                  type: boolean
                  nullable: true
                steps:
                  type: array
                  nullable: true
                  minItems: 1
                  items:
                    type: object
                    required: [step_order, action, selector]
                    properties:
                      step_order:      { type: integer, minimum: 0 }
                      action:          { type: string }
                      selector:        { type: string, minLength: 1 }
                      value:           { type: string, default: "" }
                      delay_min_ms:    { type: integer, minimum: 300, default: 500 }
                      delay_max_ms:    { type: integer, maximum: 5000, default: 900 }
                      expected_url_after_click: { type: string, nullable: true }
            example:
              is_active: false
      responses:
        "200":
          description: Ruta actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavigationPathResponse' }
        "404":
          description: Mundo no encontrado o ruta no encontrada (o de otro mundo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: |
            steps=[]; delay_min_ms < 300; delay_max_ms > 5000;
            selector con :contains() o text(); ningún campo enviado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    delete:
      tags: [noise]
      summary: "EP-N10 — Borrar ruta de navegación"
      description: |
        Borra la ruta y en cascada sus pasos.
        Verifica que path_id pertenece al world_id (404 si no).
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: path_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Ruta borrada.
        "404":
          description: Mundo no encontrado o ruta no encontrada (o de otro mundo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  # -------------------------------------------------------------------------
  # Portal de Desarrollador de Rutas — EP-RT01..EP-RT10
  # Spec: route-templates-developer-portal.md §8
  # Sin Accept-Language: labels y slugs son texto libre del desarrollador.
  # -------------------------------------------------------------------------

  /route-templates:
    get:
      tags: [route-templates]
      summary: "EP-RT01 — Listar plantillas de rutas"
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [MAP, OASIS_INFO, PLAYER_PROFILE, MESSAGES, REPORTS, BUILDING_VIEW, OTHER]
        - name: include_paths
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Lista de plantillas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouteTemplateListItem' }
        "422":
          description: category inválida.
    post:
      tags: [route-templates]
      summary: "EP-RT02 — Crear plantilla de ruta"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        "201":
          description: Plantilla creada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteTemplateResponse' }
        "409":
          description: Slug duplicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: Slug inválido / navigation_weight fuera de rango / delay_min_ms < 200 ms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /route-templates/{template_id}:
    get:
      tags: [route-templates]
      summary: "EP-RT03 — Obtener plantilla con paths+steps"
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Plantilla completa con paths y steps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteTemplateResponse' }
        "404":
          description: Plantilla no encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    put:
      tags: [route-templates]
      summary: "EP-RT04 — Actualizar plantilla (PATCH parcial)"
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTemplateRequest' }
      responses:
        "200":
          description: Plantilla actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteTemplateResponse' }
        "404":
          description: Plantilla no encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: Body vacío / campos inmutables / valores fuera de rango.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
    delete:
      tags: [route-templates]
      summary: "EP-RT05 — Borrar plantilla (instancias quedan huérfanas con template_id=null)"
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Plantilla borrada.
        "404":
          description: Plantilla no encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /route-templates/{template_id}/paths:
    get:
      tags: [route-templates]
      summary: "EP-RT06 — Listar paths de una plantilla"
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lista de paths con steps.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplatePathResponse' }
        "404":
          description: Plantilla no encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /route-templates/{template_id}/clone-to-world/{world_id}:
    post:
      tags: [route-templates]
      summary: "EP-RT07 — Clonar plantilla a un mundo"
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: integer }
        - name: world_id
          in: path
          required: true
          schema: { type: integer }
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "201":
          description: Clon nuevo creado.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [cloned] }
                  destination_id: { type: integer }
                  world_id: { type: integer }
                  template_id: { type: integer }
                  url_pattern: { type: string }
        "200":
          description: Misma plantilla ya estaba clonada (idempotente).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [already_exists] }
                  destination_id: { type: integer }
                  world_id: { type: integer }
                  template_id: { type: integer }
        "409":
          description: "URL conflictiva — conflicting_destination_id dentro de detail (dict)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      message: { type: string }
                      conflicting_destination_id: { type: integer }
        "422":
          description: URL absoluta incompatible con el servidor del mundo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "404":
          description: Plantilla o mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /worlds/{world_id}/noise/apply-templates:
    post:
      tags: [route-templates]
      summary: "EP-RT08 — Bulk clone: aplicar múltiples plantillas a un mundo"
      parameters:
        - name: world_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_ids]
              properties:
                template_ids:
                  type: array
                  items: { type: integer }
                  minItems: 1
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Resultado por plantilla (no atómico).
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        template_id: { type: integer }
                        result: { type: string, enum: [cloned, already_exists, conflict] }
                        destination_id: { type: integer, nullable: true }
                        conflicting_destination_id: { type: integer, nullable: true }
                        error: { type: string, nullable: true }
        "422":
          description: template_ids vacío.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "404":
          description: Mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /route-templates/{template_id}/sync-to-world/{world_id}:
    post:
      tags: [route-templates]
      summary: "EP-RT09 — Re-sincronizar instancia con la plantilla maestra"
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: integer }
        - name: world_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Instancia re-sincronizada (paths/steps reemplazados).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [synced] }
                  destination_id: { type: integer }
                  paths_replaced: { type: integer }
        "201":
          description: No había instancia; se creó (equivale a clone).
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [created] }
                  destination_id: { type: integer }
        "409":
          description: "URL conflictiva con destino de template_id distinto — conflicting_destination_id en detail."
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      message: { type: string }
                      conflicting_destination_id: { type: integer }
        "404":
          description: Plantilla o mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

  /route-templates/{template_id}/test:
    post:
      tags: [route-templates]
      summary: "EP-RT10 — Probar plantilla en vivo (wrapper de EP-N14)"
      parameters:
        - name: template_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [world_id]
              properties:
                world_id: { type: integer, minimum: 1 }
                path_index: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Test ejecutado (HTTP 200 aunque overall=error).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathTestResponse' }
        "404":
          description: Plantilla o mundo no encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "409":
          description: Agente desconectado o browser ocupado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "422":
          description: path_index fuera de rango.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailError' }

