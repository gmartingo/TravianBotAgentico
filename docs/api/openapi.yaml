  # ---------------------------------------------------------------------------
  # EP-TD v3 — Estadísticas de animales por frecuencia de farmeo, segmentadas por tipo de oasis
  # ---------------------------------------------------------------------------
  /attack-reports/stats/oasis/temporal-distribution:
    get:
      summary: Estadísticas de animales por frecuencia de farmeo, por tipo de oasis (EP-TD v4)
      description: |
        El cliente elige UNA frecuencia de farmeo (interval_minutes) y recibe la
        estadística de la ventana de gaps agrupada en 5 secciones fijas por tipo
        de oasis inferido: hierro, arcilla, madera, cereal, sin_clasificar.

        El tipo de oasis se infiere por Jaccard sobre los animales observados con
        present > 0 (reutiliza infer_type de EP-SPAWN). Los oasis sin ningún animal
        observado (solo derrotas) van a "sin_clasificar". Los oasis con < 3 bursts
        observados (confidence="low") se incluyen en su sección con marca de baja
        confianza (n_oasis_low_confidence).

        El gap de un reporte es la diferencia en segundos entre attacked_at del
        ataque actual y el inmediatamente anterior al mismo oasis
        (LAG con PARTITION BY coord_x_dest, coord_y_dest).
        Gaps < 360 s (< 6 min) se descartan silenciosamente.

        Binning por umbral inferior (Opción B): el bin F corresponde a la ventana
        [F*60, F_next*60) segundos. El bin 300 es abierto: [18000, ∞).

        Requiere Accept-Language (nombres de animal localizados en cada sección).
        200 siempre; las 5 secciones se devuelven aunque estén vacías.
        n_reports_in_window = suma de n_reports_in_section de las 5 secciones.

        v4 (2026-06-02): cada sección añade oasis_coords (lista de {x,y} ordenada
        y ASC, x ASC), avg_bounty (media de botín incluyendo derrotas con 0),
        total_animals (distribución del total de animales por reporte, con regla
        todo-o-nada para n_valid). Cada animal añade max_present.
        Ver spec docs/specs/bd-ataques-oasis-temporal-distribution.md §REVISIÓN v4.
      operationId: get_animal_temporal_distribution
      tags:
        - attack-reports
      parameters:
        - name: interval_minutes
          in: query
          required: false
          schema:
            type: integer
            default: 240
          description: |
            Frecuencia de farmeo en minutos. Valores válidos: 6, 7, 10, 15, 30, 60, 120, 180, 240, 300.
            Default: 240 (4h). Cualquier otro entero → 400 con detail que lista los 10 valores.
            No entero → 422 (FastAPI automático). Ausente → 200 con default 240.
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
          description: |
            Código de idioma (25 soportados en SUPPORTED_LANGUAGES).
            Ausente o código no soportado → 400.
            Ejemplos: es, en, it, de, fr.
      responses:
