          description: |
            Estadísticas calculadas para la ventana solicitada, agrupadas por tipo de oasis.
            Las 5 secciones se incluyen siempre. n_reports_in_window=0 y todas las secciones
            vacías si la ventana no tiene datos (no hay error).
