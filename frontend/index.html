<!DOCTYPE html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravianBot</title>
    <!-- El script de tema se ejecuta síncronamente antes del primer render
         para evitar el parpadeo de tema incorrecto (FOUC). -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.dataset.theme = stored
        }
        // El idioma/dir se aplica en el arranque de React (useI18n),
        // pero pre-aplicamos dir aquí para RTL y evitar reflow.
        var lang = localStorage.getItem('lang') || 'es'
        var rtl = ['ar', 'he', 'fa']
        if (rtl.includes(lang)) {
          document.documentElement.dir = 'rtl'
          document.documentElement.lang = lang
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
