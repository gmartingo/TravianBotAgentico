<!DOCTYPE html>
<!--
  PLAYGROUND DE DISEÑO — S3 Wizard alta de cuenta (2 pasos) + S6 Modal añadir mundo.
  HTML autocontenido, desacoplado del backend.
  Abrir directamente en el navegador — sin build, sin servidor.

  Toolbar:
    Vista          — selector: "Wizard" (S3) vs "Modal añadir mundo" (S6).
    Estado         — selector de estados del wizard/modal activo.
    Editar / Listo — activa modo drag & drop con imán de 8px sobre rejilla.
    Guardar        — persiste posiciones en localStorage.
    Restablecer    — vuelve a las posiciones originales.
    Exportar JSON  — copia / descarga JSON con posiciones.
    Tema           — toggle claro / oscuro.
    Idioma         — selector de los 25 idiomas con buscador y RTL.

  Pantallas / estados cubiertos:
    S3 — Wizard de alta de cuenta:
      • Paso 1 limpio          (campos vacíos, Siguiente deshabilitado)
      • Paso 1 con errores     (email inválido, campo vacío — inline bajo campo)
      • Paso 1 error 409       (email duplicado — vuelta a paso 1 con error)
      • Paso 2 limpio          (URL vacía, tribu sin seleccionar)
      • Paso 2 escribiendo URL (vista previa parseada en tiempo real)
      • Paso 2 enviando        (spinner + campos readonly)
      • Paso 2 error 409       (server duplicado — inline bajo URL)
      • Paso 2 error 422       (URL inválida — inline bajo URL)
      • Éxito                  (toast, wizard cerrado)

    S6 — Modal añadir mundo:
      • Limpio                 (campos vacíos, Añadir deshabilitado)
      • Escribiendo URL        (vista previa parseada en tiempo real)
      • Enviando               (spinner + readonly)
      • Error 409 duplicado    (inline bajo URL)
      • Error 422 URL inválida (inline bajo URL)
      • Éxito                  (toast, modal cerrado)
-->
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TravianBot · Wizard alta + Añadir mundo (playground)</title>
<style>
/* ===== TOKENS (frontend/DESIGN.md §15.1) — idénticos a cuentas.playground.html ===== */
:root {
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#EFEFF2;
  --border:#D2D2D7; --border-strong:#C7C7CC;
  --text:#1D1D1F; --text-secondary:#6E6E73; --text-tertiary:#8E8E93;
  --text-disabled:#AEAEB2;
  --accent:#8A6418; --accent-text:#8A6418; --accent-hover:#6F5012;
  --accent-subtle:rgba(138,100,24,.14);
  --btn-primary-bg:#1D1D1F; --btn-primary-text:#FFFFFF; --btn-primary-hover:#3A3A3C;
  --success:#248A3D; --danger:#C9352C; --info:#0A6FCC;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 2px 8px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-full:9999px;
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --ease:cubic-bezier(.4,0,.2,1); --dur-fast:150ms; --dur-base:220ms; --dur-slow:300ms;
  --sidebar-w:200px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1D1F; --surface:#2C2C2E; --surface-2:#3A3A3C;
    --border:#3A3A3C; --border-strong:#48484A;
    --text:#F5F5F7; --text-secondary:#AEAEB2; --text-tertiary:#8E8E93; --text-disabled:#636366;
    --accent:#CBB079; --accent-text:#CBB079; --accent-hover:#D8C089;
    --accent-subtle:rgba(203,176,121,.16);
    --btn-primary-bg:#F5F5F7; --btn-primary-text:#1D1D1F; --btn-primary-hover:#E2E2E6;
    --success:#34C759; --danger:#FF453A; --info:#0A84FF;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 12px rgba(0,0,0,.5); --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1D1F; --surface:#2C2C2E; --surface-2:#3A3A3C;
  --border:#3A3A3C; --border-strong:#48484A;
  --text:#F5F5F7; --text-secondary:#AEAEB2; --text-tertiary:#8E8E93; --text-disabled:#636366;
  --accent:#CBB079; --accent-text:#CBB079; --accent-hover:#D8C089;
  --accent-subtle:rgba(203,176,121,.16);
  --btn-primary-bg:#F5F5F7; --btn-primary-text:#1D1D1F; --btn-primary-hover:#E2E2E6;
  --success:#34C759; --danger:#FF453A; --info:#0A84FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 12px rgba(0,0,0,.5); --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}

/* ===== RESET / BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-sans); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.4;
  transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease);
  display:flex; flex-direction:column;
}
a{color:var(--accent-text);text-decoration:none;}
a:hover{color:var(--accent-hover);text-decoration:underline;}

/* ===== TOOLBAR (idéntica a cuentas.playground.html) ===== */
.toolbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 16px; border-bottom:1px solid var(--border);
  background:var(--surface); flex-shrink:0; z-index:100;
}
.toolbar .grow{flex:1; min-width:0;}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-inline-end:4px;white-space:nowrap;}
.logo{width:26px;height:26px;border-radius:7px;background:var(--btn-primary-bg);color:var(--btn-primary-text);
      display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;}
.tb-btn{
  appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  height:32px; padding:0 12px; border-radius:var(--radius-sm); cursor:pointer;
  font-family:inherit; font-size:13px; display:flex; align-items:center; gap:6px;
  transition:background var(--dur-fast) var(--ease); white-space:nowrap;
}
.tb-btn:hover{background:var(--surface-2);}
.tb-btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:transparent;}
.tb-btn.primary:hover{background:var(--btn-primary-hover);}
.tb-btn.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-text);background:var(--accent-subtle);}
.icon-btn{
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
  width:32px; height:32px; border-radius:var(--radius-sm); display:grid; place-items:center;
  cursor:pointer; flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn svg{width:17px;height:17px;}
.hint{color:var(--text-tertiary);font-size:12px;white-space:nowrap;}
.state-label{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.state-select{
  height:32px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  border-radius:var(--radius-sm); padding:0 8px; font-family:inherit; font-size:13px; cursor:pointer;
}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}

/* lang selector */
.lang-wrap{position:relative;}
.lang-btn{
  appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  height:32px; border-radius:var(--radius-sm); display:flex; align-items:center; gap:8px; padding:0 12px;
  cursor:pointer; font-family:inherit; font-size:13px; white-space:nowrap;
}
.lang-btn:hover{background:var(--surface-2);}
.lang-btn svg{width:15px;height:15px;color:var(--text-secondary);}
.lang-panel{
  position:absolute; inset-inline-end:0; top:calc(100% + 8px); width:280px; max-width:calc(100vw - 32px);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg); overflow:hidden; z-index:200; display:none;
}
.lang-panel.open{display:block;}
.lang-search-wrap{padding:10px;border-bottom:1px solid var(--border);}
.lang-search{
  width:100%; height:32px; border:1px solid var(--border-strong); background:var(--surface-2);
  color:var(--text); border-radius:var(--radius-sm); padding:0 10px;
  font-family:inherit; font-size:13px; outline:none;
}
.lang-search:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px;}
.lang-list{max-height:280px;overflow-y:auto;padding:6px;}
.lang-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  padding:8px 10px; border-radius:var(--radius-sm); cursor:pointer; border:none;
  background:transparent; color:var(--text); font-family:inherit; font-size:13px; text-align:start;
}
.lang-item:hover{background:var(--surface-2);}
.lang-item .code{color:var(--text-tertiary);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;}
.lang-item[aria-selected="true"]{background:var(--accent-subtle);color:var(--accent-text);font-weight:600;}
.lang-item[aria-selected="true"] .code{color:var(--accent-text);}

/* ===== APP TOPBAR (idéntica a cuentas.playground.html) ===== */
.app-topbar{
  display:flex; align-items:center; gap:12px; padding:0 20px; height:52px;
  background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0;
}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;}
.app-logo{
  width:28px;height:28px;border-radius:7px;background:var(--btn-primary-bg);
  color:var(--btn-primary-text);display:grid;place-items:center;font-weight:700;font-size:12px;
}
.app-topbar-grow{flex:1;}
.app-theme-btn{
  appearance:none; border:1px solid var(--border); background:transparent; color:var(--text-secondary);
  width:32px; height:32px; border-radius:var(--radius-sm); display:grid; place-items:center;
  cursor:pointer;
}
.app-theme-btn:hover{background:var(--surface-2);color:var(--text);}
.app-theme-btn svg{width:16px;height:16px;}
.app-lang-btn{
  appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  height:30px; border-radius:var(--radius-sm); display:flex; align-items:center; gap:6px; padding:0 10px;
  cursor:pointer; font-family:inherit; font-size:13px;
}
.app-lang-btn:hover{background:var(--surface-2);}
.app-lang-btn svg{width:14px;height:14px;color:var(--text-secondary);}

/* ===== SHELL BODY ===== */
.app-body{display:flex;flex:1;min-height:0;overflow:hidden;}

/* ===== SIDEBAR (idéntico a cuentas.playground.html) ===== */
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--surface); border-inline-end:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px;
  border-radius:var(--radius-sm); cursor:pointer; border:none;
  background:transparent; color:var(--text); font-family:inherit; font-size:14px;
  text-align:start; width:100%; position:relative; transition:background var(--dur-fast) var(--ease);
}
.nav-item:hover:not([disabled]){background:var(--surface-2);}
.nav-item[disabled]{color:var(--text-disabled);cursor:not-allowed;}
.nav-item.active{background:var(--accent-subtle); color:var(--accent-text); font-weight:500;}
.nav-item.active::before{
  content:''; position:absolute; inset-block:4px; inset-inline-start:0;
  width:3px; border-radius:var(--radius-full); background:var(--accent);
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-item .nav-label{flex:1;}
.nav-item .nav-soon{font-size:10px;color:var(--text-disabled);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono);}

/* ===== CONTENT AREA ===== */
.content{flex:1;overflow-y:auto;padding:28px 32px;position:relative;}

/* ===== DRAG & DROP ===== */
body.editing .canvas-area{
  background-image:
    linear-gradient(to right,color-mix(in srgb,var(--border) 60%,transparent) 1px,transparent 1px),
    linear-gradient(to bottom,color-mix(in srgb,var(--border) 60%,transparent) 1px,transparent 1px);
  background-size:8px 8px;
}
.drag-block{position:relative;}
body.editing .drag-block{outline:1px dashed transparent;border-radius:4px;cursor:grab;transition:outline-color var(--dur-fast);}
body.editing .drag-block:hover{outline-color:var(--accent);}
body.editing .drag-block.dragging{cursor:grabbing;outline:2px solid var(--accent);box-shadow:var(--shadow-md);z-index:10;}

/* ===== FOCO ACCESIBLE ===== */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ===== TOAST ===== */
.toast{
  position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:90vw;
  background:var(--btn-primary-bg);color:var(--btn-primary-text);padding:10px 16px;
  border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);font-size:13px;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity var(--dur-base) var(--ease),transform var(--dur-base) var(--ease);
  z-index:500;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ===== MODAL BASE ===== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  backdrop-filter:blur(2px);z-index:400;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity var(--dur-slow) var(--ease);
}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{
  background:var(--surface); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg); width:min(480px,92vw);
  max-height:90vh; display:flex; flex-direction:column;
  transform:translateY(8px);
  transition:transform var(--dur-slow) var(--ease);
}
.modal-backdrop.open .modal{transform:translateY(0);}

/* Modal más estrecho para S6 */
.modal.narrow{width:min(440px,92vw);}

.modal-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 20px 14px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.modal-title{font-size:17px;font-weight:600;letter-spacing:-0.01em;}
.modal-close{
  appearance:none; border:none; background:transparent; color:var(--text-secondary);
  width:28px;height:28px;border-radius:var(--radius-sm);display:grid;place-items:center;
  cursor:pointer; font-size:18px; line-height:1; flex-shrink:0;
}
.modal-close:hover{background:var(--surface-2);color:var(--text);}

.modal-body{padding:20px;overflow-y:auto;flex:1;}
.modal-footer{
  display:flex;align-items:center;gap:8px;justify-content:flex-end;
  padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0;
}
/* footer con botón ghost al inicio */
.modal-footer.spread{justify-content:space-between;}

/* ===== BOTONES ===== */
.btn-primary{
  appearance:none; border:none; background:var(--btn-primary-bg); color:var(--btn-primary-text);
  height:32px; padding:0 14px; border-radius:var(--radius-sm); cursor:pointer;
  font-family:inherit; font-size:13px; font-weight:500; white-space:nowrap;
  transition:background var(--dur-fast) var(--ease); display:inline-flex; align-items:center; gap:6px;
}
.btn-primary:hover:not(:disabled){background:var(--btn-primary-hover);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}

.btn-secondary{
  appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  height:32px; padding:0 14px; border-radius:var(--radius-sm); cursor:pointer;
  font-family:inherit; font-size:13px; white-space:nowrap;
  transition:background var(--dur-fast) var(--ease); display:inline-flex; align-items:center; gap:6px;
}
.btn-secondary:hover:not(:disabled){background:var(--surface-2);}
.btn-secondary:disabled{opacity:0.5;cursor:not-allowed;}

.btn-ghost{
  appearance:none; border:none; background:transparent; color:var(--accent-text);
  height:32px; padding:0 10px; border-radius:var(--radius-sm); cursor:pointer;
  font-family:inherit; font-size:13px; white-space:nowrap;
  transition:color var(--dur-fast) var(--ease); display:inline-flex; align-items:center; gap:6px;
}
.btn-ghost:hover:not(:disabled){color:var(--accent-hover);}
.btn-ghost:disabled{opacity:0.5;cursor:not-allowed;}

/* ===== STEPPER ===== */
.stepper{
  display:flex;align-items:center;gap:0;margin-bottom:6px;
}
.step-circle{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);
  display:grid;place-items:center;font-size:12px;font-weight:600;
  color:var(--text-secondary);flex-shrink:0;
  transition:background var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease),color var(--dur-base) var(--ease);
}
.step-circle.active{
  background:var(--accent);border-color:var(--accent);color:var(--surface);
}
.step-circle.done{
  background:var(--accent-subtle);border-color:var(--accent);color:var(--accent-text);
}
.step-line{flex:1;height:2px;background:var(--border);margin:0 6px;
  transition:background var(--dur-base) var(--ease);}
.step-line.done{background:var(--accent);}
.step-label{font-size:12px;color:var(--text-secondary);margin-top:8px;margin-bottom:16px;}

/* ===== FORM FIELDS ===== */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.field-label{
  font-size:12px;font-weight:500;color:var(--text-secondary);
}
.field-label .req{color:var(--danger);margin-inline-start:2px;}
.inp{
  width:100%; height:36px; border:1px solid var(--border-strong); background:var(--surface);
  color:var(--text); border-radius:var(--radius-sm); padding:0 10px;
  font-family:inherit; font-size:14px; outline:none;
  transition:border-color var(--dur-fast) var(--ease);
}
/* input font-size >=16px en móvil (evita zoom iOS) */
@media (max-width:767px){.inp{font-size:16px;}}
.inp::placeholder{color:var(--text-tertiary);}
.inp:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px;}
.inp.error{border-color:var(--danger);}
.inp.error:focus{outline-color:var(--danger);}
.inp:disabled,.inp[readonly]{opacity:0.65;cursor:not-allowed;background:var(--surface-2);}

/* select nativo */
.inp-select{
  width:100%; height:36px; border:1px solid var(--border-strong); background:var(--surface);
  color:var(--text); border-radius:var(--radius-sm); padding:0 10px;
  font-family:inherit; font-size:14px; outline:none; cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease);
}
@media (max-width:767px){.inp-select{font-size:16px;}}
.inp-select:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px;}
.inp-select.error{border-color:var(--danger);}
.inp-select:disabled{opacity:0.65;cursor:not-allowed;}

/* password toggle wrapper */
.pw-wrap{position:relative;display:flex;align-items:center;}
.pw-wrap .inp{padding-inline-end:38px;width:100%;}
.pw-toggle{
  position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);
  appearance:none;border:none;background:transparent;color:var(--text-secondary);
  width:24px;height:24px;display:grid;place-items:center;cursor:pointer;border-radius:4px;
}
.pw-toggle:hover{color:var(--text);}
.pw-toggle svg{width:16px;height:16px;}

/* field error message */
.field-error{
  font-size:12px;color:var(--danger);display:none;
}
.field-error.show{display:block;}

/* server preview */
.server-preview{
  font-size:12px;color:var(--accent-text);margin-top:-10px;margin-bottom:0;min-height:16px;
  font-family:var(--font-mono);
}
.server-preview.empty{color:var(--text-tertiary);}

/* section title inside modal body */
.section-title{
  font-size:17px;font-weight:600;letter-spacing:-0.01em;margin-bottom:16px;
}

/* ===== SPINNER (inline botón) ===== */
.spinner{
  width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;display:inline-block;animation:spin 0.6s linear infinite;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== ERROR BANNER (409 sesión activa — no usado en este playground pero incluido) ===== */
.error-block{
  display:flex;gap:10px;padding:12px 14px;
  background:rgba(201,53,44,.08);
  border-inline-start:3px solid var(--danger);
  border-radius:var(--radius-sm);margin-bottom:12px;
}
[data-theme="dark"] .error-block{background:rgba(255,69,58,.10);}
.error-block svg{width:16px;height:16px;color:var(--danger);flex-shrink:0;margin-top:1px;}
.error-block-text{font-size:13px;color:var(--text);flex:1;}

/* ===== CANVAS PLACEHOLDER (lo que se ve detrás del modal) ===== */
.canvas-placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:200px;gap:10px;color:var(--text-tertiary);text-align:center;

<!-- ==================== WIZARD MODAL (S3) ==================== -->
<div class="modal-backdrop" id="wizardBackdrop" role="dialog" aria-modal="true" aria-labelledby="wizardTitle">
  <div class="modal" id="wizardModal">

    <div class="modal-header">
      <span class="modal-title" id="wizardTitle" data-i18n="wizard.title">Nueva cuenta</span>
      <button class="modal-close" id="wizardClose" aria-label="Cerrar">&times;</button>
    </div>

    <div class="modal-body" id="wizardBody">

      <!-- STEPPER -->
      <div class="stepper" id="wizardStepper" aria-label="Pasos del wizard">
        <div class="step-circle active" id="step1Circle" aria-current="step" role="listitem">1</div>
        <div class="step-line" id="stepLine"></div>
        <div class="step-circle" id="step2Circle" role="listitem">2</div>
      </div>
      <p class="step-label" id="stepLabel" data-i18n="wizard.step">Paso 1 de 2</p>

      <!-- PASO 1 — Datos de la cuenta -->
      <div id="wizardStep1">
        <p class="section-title" data-i18n="wizard.section.account">Datos de la cuenta</p>

        <div class="field">
          <label class="field-label" for="wEmail">
            <span data-i18n="wizard.field.email">Email</span><span class="req">*</span>
          </label>
          <input class="inp" type="email" id="wEmail" autocomplete="username"
                 data-i18n-ph="wizard.field.email.ph" placeholder="jugador@ejemplo.com" />
          <span class="field-error" id="wEmailError" role="alert"></span>
        </div>

        <div class="field">
          <label class="field-label" for="wUsername">
            <span data-i18n="wizard.field.username">Usuario</span><span class="req">*</span>
          </label>
          <input class="inp" type="text" id="wUsername" autocomplete="off"
                 data-i18n-ph="wizard.field.username.ph" placeholder="MiCuenta" />
          <span class="field-error" id="wUsernameError" role="alert"></span>
        </div>

        <div class="field">
          <label class="field-label" for="wPassword">
            <span data-i18n="wizard.field.password">Contraseña</span><span class="req">*</span>
          </label>
          <div class="pw-wrap">
            <input class="inp" type="password" id="wPassword" autocomplete="new-password"
                   data-i18n-ph="wizard.field.password.ph" placeholder="••••••••" />
            <button class="pw-toggle" type="button" id="wPasswordToggle" aria-label="Mostrar contraseña">
              <svg id="wPasswordEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="wPasswordError" role="alert"></span>
        </div>
      </div>

      <!-- PASO 2 — Primer mundo -->
      <div id="wizardStep2" style="display:none;">
        <p class="section-title" data-i18n="wizard.section.world">Primer mundo</p>

        <div class="field">
          <label class="field-label" for="wServerUrl">
            <span data-i18n="wizard.field.server">URL del servidor</span><span class="req">*</span>
          </label>
          <input class="inp" type="url" id="wServerUrl" autocomplete="off"
                 data-i18n-ph="wizard.field.server.ph"
                 placeholder="https://ts1.x1.international.travian.com/" />
          <p class="server-preview empty" id="wServerPreview" aria-live="polite">—</p>
          <span class="field-error" id="wServerError" role="alert"></span>
        </div>

        <div class="field">
          <label class="field-label" for="wTribe">
            <span data-i18n="wizard.field.tribe">Tribu</span><span class="req">*</span>
          </label>
          <select class="inp-select" id="wTribe">
            <option value="" data-i18n="wizard.field.tribe.ph">Selecciona una tribu</option>
            <option value="romans"    data-i18n="tribe.romans">Romans</option>
            <option value="teutons"   data-i18n="tribe.teutons">Teutons</option>
            <option value="gauls"     data-i18n="tribe.gauls">Gauls</option>
            <option value="egyptians" data-i18n="tribe.egyptians">Egyptians</option>
            <option value="huns"      data-i18n="tribe.huns">Huns</option>
            <option value="spartans"  data-i18n="tribe.spartans">Spartans</option>
            <option value="vikings"   data-i18n="tribe.vikings">Vikings</option>
          </select>
          <span class="field-error" id="wTribeError" role="alert"></span>
        </div>
      </div>

    </div><!-- /modal-body -->

    <!-- FOOTER PASO 1 -->
    <div class="modal-footer" id="wizardFooter1">

        <button class="btn-secondary" id="wCancelBtn2" data-i18n="wizard.btn.cancel">Cancelar</button>

</div><!-- /wizardBackdrop -->

          <option value="gauls"     data-i18n="tribe.gauls">Gauls</option>
          <option value="egyptians" data-i18n="tribe.egyptians">Egyptians</option>
          <option value="huns"      data-i18n="tribe.huns">Huns</option>
          <option value="spartans"  data-i18n="tribe.spartans">Spartans</option>

function applyLang(code){
  curLang = code; localStorage.setItem(LANG_KEY, code);
  root.lang = code; root.dir = RTL.has(code) ? "rtl" : "ltr";
  const f = LANGS.find(l => l.code === code);
  const name = f ? f.name : code;
  langBtnLabel.textContent = name;
  appLangLabel.textContent = name;
  langSearch.placeholder = t(code, "search");

  // data-i18n texto
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if(!key) return;
    const val = t(code, key);
    if(val !== key) el.textContent = val;
  });
  // data-i18n-ph placeholder
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const key = el.dataset.i18nPh;
    if(key) el.placeholder = t(code, key);
  });
  // Tooltips "próximamente"
  document.querySelectorAll("[data-soon]").forEach(el => {
    el.title = t(code, "tooltip.comingSoon");
  });
  // Actualizar select de estados
  rebuildStateOptions();
  // hint
  const hintEl = document.getElementById("hint");
  const editing = document.body.classList.contains("editing");
  hintEl.textContent = editing ? t(code, "hint.edit") : t(code, "hint.view");
  // stepper label
  updateStepLabel();
  renderLangList(langSearch.value);
}

function renderLangList(filter){
  const q = (filter||"").trim().toLowerCase();
  const items = LANGS.filter(l => !q || l.name.toLowerCase().includes(q) || l.code.includes(q));
  langList.innerHTML = items.map(l =>
    `<button class="lang-item" role="option" data-code="${l.code}" aria-selected="${l.code === curLang}">
      <span>${l.name}</span><span class="code">${l.code}</span>
    </button>`
  ).join("");
  langList.querySelectorAll(".lang-item").forEach(b => b.addEventListener("click", () => {
    applyLang(b.dataset.code);
    langPanel.classList.remove("open");
    langBtn.setAttribute("aria-expanded","false");
  }));
}
langBtn.addEventListener("click", () => {
  const open = langPanel.classList.toggle("open");
  langBtn.setAttribute("aria-expanded", open ? "true" : "false");
  if(open){ langSearch.value=""; renderLangList(""); setTimeout(() => langSearch.focus(), 0); }
});
langSearch.addEventListener("input", () => renderLangList(langSearch.value));
document.addEventListener("click", e => {
  if(!e.target.closest(".lang-wrap")){
    langPanel.classList.remove("open");
    langBtn.setAttribute("aria-expanded","false");
  }
});

/* ===================================================================
   PARSEO DE URL DE SERVIDOR
   Extrae server · speed · region del hostname de una URL de Travian.
   https://ts1.x1.international.travian.com/ → ts1 · x1 · international
   =================================================================== */
function parseServerUrl(raw){
  if(!raw || !raw.trim()) return null;
  try{
    const url = new URL(raw.trim());
    if(!["http:","https:"].includes(url.protocol)) return null;
    const parts = url.hostname.split(".");
    if(parts.length < 3) return null;
    const server = parts[0];  // ts1, ts2, …
    const speed  = parts.find(p => /^x\d+$/i.test(p));    // x1, x3, …
    // region: primer segmento alfabético que no sea un TLD ni "travian"
    const skipSet = new Set(["travian","com","net","org","de","es","fr","it","ru","pl","nl","ar","br"]);
    const region = parts.slice(1).find(p => /^[a-z]/i.test(p) && !skipSet.has(p.toLowerCase()) && !/^x\d+$/i.test(p));
    if(!server) return null;
    const pieces = [server, speed, region].filter(Boolean);
    return pieces.join(" · ");
  }catch(e){
    return null;
  }
}

function updatePreview(inputEl, previewEl){
  const result = parseServerUrl(inputEl.value);
  if(result){
    previewEl.textContent = result;
    previewEl.classList.remove("empty");
  } else {
    previewEl.textContent = "—";
    previewEl.classList.add("empty");
  }
}

   VALIDACIONES
   =================================================================== */
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); }
function isValidUrl(v){
  try{ const u = new URL(v.trim()); return ["http:","https:"].includes(u.protocol); }
  catch(e){ return false; }
}
function showFieldError(errEl, msg){
  errEl.textContent = msg; errEl.classList.add("show");
}
function clearFieldError(errEl, inpEl){
  errEl.classList.remove("show"); errEl.textContent = "";
  inpEl.classList.remove("error");
}
function markFieldError(inpEl, errEl, msg){
  inpEl.classList.add("error");
  showFieldError(errEl, msg);
}

function goToStep(n){
  wizardStep = n;
  const isStep1 = (n === 1);
  wizardStep1El.style.display = isStep1 ? "" : "none";
  wizardStep2El.style.display = isStep1 ? "none" : "";
  wizardFooter1.style.display = isStep1 ? "" : "none";
  wizardFooter2.style.display = isStep1 ? "none" : "";
  // stepper
  step1Circle.className = "step-circle " + (n >= 1 ? (n > 1 ? "done" : "active") : "");
  step1Circle.setAttribute("aria-current", n === 1 ? "step" : "false");
  step2Circle.className = "step-circle " + (n >= 2 ? "active" : "");
  step2Circle.setAttribute("aria-current", n === 2 ? "step" : "false");
  stepLine.className    = "step-line " + (n > 1 ? "done" : "");
  updateStepLabel();
}

function validateStep1(){
  let ok = true;
  clearFieldError(wEmailError, wEmail);
  clearFieldError(wUsernameError, wUsername);
  clearFieldError(wPasswordError, wPassword);

  const email = wEmail.value.trim();
  const uname = wUsername.value.trim();
  const pass  = wPassword.value;

  if(!email){ markFieldError(wEmail, wEmailError, t(curLang,"wizard.error.required")); ok=false; }
  else if(!isValidEmail(email)){ markFieldError(wEmail, wEmailError, t(curLang,"wizard.error.email.invalid")); ok=false; }
  if(!uname){ markFieldError(wUsername, wUsernameError, t(curLang,"wizard.error.required")); ok=false; }
  if(!pass){ markFieldError(wPassword, wPasswordError, t(curLang,"wizard.error.required")); ok=false; }
  return ok;
}

  const email = wEmail.value.trim();
  const uname = wUsername.value.trim();

/* ===================================================================
   OPEN / CLOSE MODAL (con focus trap)
   =================================================================== */
const MODAL_MAP = {
  wizard:   { backdrop: document.getElementById("wizardBackdrop"),   firstFocus: () => wEmail },
  addWorld: { backdrop: document.getElementById("addWorldBackdrop"), firstFocus: () => mServerUrl },
};

let lastFocusedEl = null;

function openModal(which){
  const m = MODAL_MAP[which]; if(!m) return;
  lastFocusedEl = document.activeElement;
  m.backdrop.classList.add("open");
  // foco al primer campo tras la transición
  setTimeout(() => { try{ m.firstFocus().focus(); }catch(e){} }, 50);
  // focus trap
  m.backdrop.__trapHandler = (e) => {
    if(e.key !== "Tab") return;
    const focusable = [...m.backdrop.querySelectorAll(
      'button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])'
    )];
    if(focusable.length === 0){ e.preventDefault(); return; }
    const first = focusable[0], last = focusable[focusable.length - 1];
    if(e.shiftKey){ if(document.activeElement === first){ e.preventDefault(); last.focus(); } }
    else          { if(document.activeElement === last ){ e.preventDefault(); first.focus(); } }
  };
  m.backdrop.__escHandler = (e) => {
    if(e.key === "Escape"){ resetAndClose(which); }
  };
  document.addEventListener("keydown", m.backdrop.__trapHandler);
  document.addEventListener("keydown", m.backdrop.__escHandler);
}

function closeModal(which){
  const m = MODAL_MAP[which]; if(!m) return;
  m.backdrop.classList.remove("open");
  if(m.backdrop.__trapHandler) document.removeEventListener("keydown", m.backdrop.__trapHandler);
  if(m.backdrop.__escHandler)  document.removeEventListener("keydown", m.backdrop.__escHandler);
  if(lastFocusedEl){ try{ lastFocusedEl.focus(); }catch(e){} }
}

function resetAndClose(which){
  if(which === "wizard"){ resetWizard(); closeModal("wizard"); }
  else{ resetModal(); closeModal("addWorld"); }
}

// Cierre al hacer clic en el backdrop (fuera del modal)
document.getElementById("wizardBackdrop").addEventListener("click", e => {
  if(e.target === document.getElementById("wizardBackdrop")){ resetAndClose("wizard"); }
});
document.getElementById("addWorldBackdrop").addEventListener("click", e => {
  if(e.target === document.getElementById("addWorldBackdrop")){ resetAndClose("addWorld"); }
});

/* ===================================================================
   DRAG & DROP (imán 8px — idéntico a cuentas.playground.html)
   =================================================================== */
const contentArea = document.getElementById("contentArea");
const dragBlocks = () => [...contentArea.querySelectorAll(".drag-block")];
function snap(v){ return Math.round(v/8)*8; }
let drag = null;
contentArea.addEventListener("pointerdown", e => {
  if(!document.body.classList.contains("editing")) return;
  const el = e.target.closest(".drag-block"); if(!el) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId); el.classList.add("dragging");
  drag = { el, startX:e.clientX, startY:e.clientY, origX:el.offsetLeft, origY:el.offsetTop };
});
contentArea.addEventListener("pointermove", e => {
  if(!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  const maxX = contentArea.clientWidth  - drag.el.offsetWidth;
  const maxY = contentArea.scrollHeight - drag.el.offsetHeight;
  drag.el.style.left = Math.max(0, Math.min(maxX, snap(drag.origX + dx))) + "px";
  drag.el.style.top  = Math.max(0, Math.min(maxY, snap(drag.origY + dy))) + "px";
});
function endDrag(e){
  if(!drag) return;
  drag.el.classList.remove("dragging");
  try{ drag.el.releasePointerCapture(e.pointerId); }catch(x){}
  drag = null;
}
contentArea.addEventListener("pointerup", endDrag);
contentArea.addEventListener("pointercancel", endDrag);

/* ===================================================================
   EDIT MODE
   =================================================================== */
const editBtn = document.getElementById("editBtn");
const hintEl  = document.getElementById("hint");
let editing = false;

editBtn.addEventListener("click", () => {
  editing = !editing;
  document.body.classList.toggle("editing", editing);
  editBtn.setAttribute("aria-pressed", editing ? "true" : "false");
  editBtn.textContent = editing ? "✓ Listo" : "✎ Editar";
  hintEl.textContent = editing ? t(curLang,"hint.edit") : t(curLang,"hint.view");

  if(editing){
    dragBlocks().forEach(b => {
      const rect = b.getBoundingClientRect();
      const pRect = contentArea.getBoundingClientRect();
      b.style.position = "absolute";
      b.style.left = snap(rect.left - pRect.left + contentArea.scrollLeft) + "px";
      b.style.top  = snap(rect.top  - pRect.top  + contentArea.scrollTop)  + "px";
      b.style.width = b.offsetWidth + "px";
    });
    contentArea.style.position = "relative";
    contentArea.style.height = contentArea.scrollHeight + "px";
  } else {
    dragBlocks().forEach(b => { b.style.position=""; b.style.left=""; b.style.top=""; b.style.width=""; });
    contentArea.style.position = ""; contentArea.style.height = "";
  }
});

/* ===================================================================
   GUARDAR / RESTABLECER / EXPORTAR
   =================================================================== */
function currentLayout(){
  const out = {};
  dragBlocks().forEach(b => { if(b.style.left) out[b.dataset.dragId] = {x:b.offsetLeft,y:b.offsetTop}; });
  return out;
}
document.getElementById("saveBtn").addEventListener("click", () => {
  localStorage.setItem(LAYOUT_KEY, JSON.stringify(currentLayout()));
  showToast("Layout guardado");
});
document.getElementById("resetBtn").addEventListener("click", () => {
  localStorage.removeItem(LAYOUT_KEY);
  dragBlocks().forEach(b => { b.style.left=""; b.style.top=""; b.style.width=""; b.style.position=""; });
  contentArea.style.position=""; contentArea.style.height="";
  editing=false; document.body.classList.remove("editing");
  editBtn.setAttribute("aria-pressed","false"); editBtn.textContent="✎ Editar";
  hintEl.textContent = t(curLang,"hint.view");
  showToast("Layout restablecido");
});
document.getElementById("exportBtn").addEventListener("click", async () => {
  const data = {
    view: curView, state: curState,
    canvas: {w:contentArea.clientWidth, h:contentArea.clientHeight}, grid:8,
    blocks: currentLayout(),
  };
  const json = JSON.stringify(data, null, 2);
  try{ await navigator.clipboard.writeText(json); showToast("Layout copiado al portapapeles"); }
  catch(e){ showToast("Descargando layout…"); }
  const blob = new Blob([json],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "wizard.layout.json"; a.click(); URL.revokeObjectURL(a.href);
});

  applyViewState();             // abre el modal en el estado inicial
})();
