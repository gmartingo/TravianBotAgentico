<!DOCTYPE html>
<!--
  PLAYGROUND DE DISEÑO — Simulador y Optimizador de Combate
  HTML autocontenido — cero dependencias del backend ni build.
  Abrir directamente en el navegador.

  Vistas disponibles (selector "Vista"):
    1. Simulador — formulario + estado vacío
    2. Simulador — con resultado (atacante gana)
    3. Simulador — con resultado (defensor gana)
    4. Optimizador — formulario + estado vacío
    5. Optimizador — con resultado (alternativas Pareto)
    6. Estado error

  Controles:
    — Toggle tema (claro / oscuro)
    — Selector de vista
    — Modo Editar: drag & drop con imán de 8px
    — Guardar (localStorage) / Restablecer / Exportar layout (JSON)

  Spec: docs/design/simulador-combate-ui.md
-->
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TravianBot · Simulador de Combate (playground)</title>
<style>
/* ===== TOKENS ===== */
:root{
  --bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#EFEFF2;
  --border:#D2D2D7;--border-strong:#C7C7CC;
  --text:#1D1D1F;--text-secondary:#6E6E73;--text-tertiary:#8E8E93;--text-disabled:#AEAEB2;
  --accent:#8A6418;--accent-text:#8A6418;--accent-hover:#6F5012;--accent-subtle:rgba(138,100,24,.14);
  --btn-primary-bg:#1D1D1F;--btn-primary-text:#FFFFFF;--btn-primary-hover:#3A3A3C;
  --success:#248A3D;--danger:#C9352C;--info:#0A6FCC;
  --success-subtle:rgba(36,138,61,.12);--danger-subtle:rgba(201,53,44,.08);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 2px 8px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-full:9999px;
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --ease:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-base:220ms;--dur-slow:300ms;
  --sidebar-w:180px;--topbar-h:52px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1D1F;--surface:#2C2C2E;--surface-2:#3A3A3C;
  --border:#3A3A3C;--border-strong:#48484A;
  --text:#F5F5F7;--text-secondary:#AEAEB2;--text-tertiary:#8E8E93;--text-disabled:#636366;
  --accent:#CBB079;--accent-text:#CBB079;--accent-hover:#D8C089;--accent-subtle:rgba(203,176,121,.16);
  --btn-primary-bg:#F5F5F7;--btn-primary-text:#1D1D1F;--btn-primary-hover:#E2E2E6;
  --success:#34C759;--danger:#FF453A;--info:#0A84FF;
  --success-subtle:rgba(52,199,89,.12);--danger-subtle:rgba(255,69,58,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 12px rgba(0,0,0,.5);--shadow-lg:0 12px 32px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#1D1D1F;--surface:#2C2C2E;--surface-2:#3A3A3C;
  --border:#3A3A3C;--border-strong:#48484A;
  --text:#F5F5F7;--text-secondary:#AEAEB2;--text-tertiary:#8E8E93;--text-disabled:#636366;
  --accent:#CBB079;--accent-text:#CBB079;--accent-hover:#D8C089;--accent-subtle:rgba(203,176,121,.16);
  --btn-primary-bg:#F5F5F7;--btn-primary-text:#1D1D1F;--btn-primary-hover:#E2E2E6;
  --success:#34C759;--danger:#FF453A;--info:#0A84FF;
  --success-subtle:rgba(52,199,89,.12);--danger-subtle:rgba(255,69,58,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 12px rgba(0,0,0,.5);--shadow-lg:0 12px 32px rgba(0,0,0,.6);
}

/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;
  transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}

/* ===== TOOLBAR PLAYGROUND ===== */
.toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 16px;border-bottom:1px solid var(--border);
  background:var(--surface);flex-shrink:0;z-index:100;
  font-size:12px;
}
.toolbar-label{color:var(--text-secondary);font-size:11px;white-space:nowrap;}
.toolbar select,.toolbar button{
  font-family:inherit;font-size:12px;padding:4px 8px;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);cursor:pointer;
}
.toolbar button{transition:background var(--dur-fast);}
.toolbar button:hover{background:var(--surface-2);}
.toolbar button.active{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:transparent;}
.toolbar-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.grow{flex:1;}

/* ===== APP SHELL ===== */
.app-shell{display:flex;flex:1;min-height:0;overflow:hidden;}

/* ===== FAKE SIDEBAR ===== */
.fake-sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--surface);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;padding:12px 8px;gap:2px;
  overflow:hidden;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:var(--radius-sm);font-size:14px;color:var(--text);
  cursor:pointer;position:relative;
}
.nav-item.active{
  background:var(--accent-subtle);color:var(--accent-text);font-weight:500;
}
.nav-item.active::before{
  content:'';position:absolute;inset-block:4px;inset-inline-start:0;
  width:3px;border-radius:var(--radius-full);background:var(--accent);
}
.nav-item:not(.active):hover{background:var(--surface-2);}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7;}

/* ===== MAIN CONTENT ===== */
.main-content{
  flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;
}
.tab-content{
  flex:1;overflow-y:auto;padding:24px;
  display:flex;flex-direction:column;gap:16px;
}

/* ===== CALC LAYOUT ===== */
.calc-layout{
  display:flex;gap:0;flex:1;min-height:0;
  background:var(--bg);
}
.calc-form-panel{
  width:420px;flex-shrink:0;
  background:var(--surface);
  border-inline-end:1px solid var(--border);
  overflow-y:auto;padding:20px;
  display:flex;flex-direction:column;gap:16px;
}
.calc-result-panel{
  flex:1;min-width:0;overflow-y:auto;padding:24px;
  display:flex;flex-direction:column;gap:16px;
}

/* ===== SEGMENT CONTROL ===== */
.segment{
  display:flex;background:var(--surface-2);border-radius:var(--radius-sm);
  padding:2px;gap:2px;
}
.segment-btn{
  flex:1;padding:6px 12px;border-radius:4px;border:none;
  font-family:inherit;font-size:13px;font-weight:500;
  cursor:pointer;color:var(--text-secondary);background:transparent;
  transition:background var(--dur-fast),color var(--dur-fast);
}
.segment-btn.active{
  background:var(--surface);color:var(--text);
  box-shadow:var(--shadow-sm);
}

/* ===== FORM SECTIONS ===== */
.form-section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:8px;border-bottom:1px solid var(--border);
  margin-bottom:12px;
}
.form-section-title{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary);}
.form-section-action{font-size:12px;color:var(--accent-text);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;}
.form-section-action:hover{color:var(--accent-hover);}

/* ===== TRIBE SELECTOR + MODE TOGGLE ===== */
.form-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.form-label{font-size:12px;color:var(--text-secondary);white-space:nowrap;min-width:60px;}
.form-select{
  font-family:inherit;font-size:13px;padding:5px 10px;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);cursor:pointer;flex:1;
}
.mode-toggle{
  display:flex;gap:2px;background:var(--surface-2);border-radius:var(--radius-sm);padding:2px;
}
.mode-btn{
  padding:4px 10px;border-radius:4px;border:none;
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  color:var(--text-secondary);background:transparent;
  transition:background var(--dur-fast),color var(--dur-fast);
}
.mode-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}

/* ===== TROOP LIST ===== */
.troop-list{display:flex;flex-direction:column;gap:0;}
.troop-row{
  display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--border);
}
.troop-row:last-child{border-bottom:none;}
.troop-icon{
  width:24px;height:24px;border-radius:4px;flex-shrink:0;
  background:var(--surface-2);display:grid;place-items:center;
  font-size:10px;font-weight:600;color:var(--text-tertiary);
}
.troop-icon img{width:100%;height:100%;object-fit:contain;border-radius:4px;}
.troop-name{flex:1;font-size:13px;color:var(--text);}
.troop-row.dim .troop-icon,.troop-row.dim .troop-name{opacity:.45;}
.troop-qty{
  width:68px;font-family:var(--font-mono);font-size:13px;padding:3px 6px;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);text-align:end;
  font-variant-numeric:tabular-nums;
}
.troop-smithy-label{font-size:11px;color:var(--text-tertiary);}
.troop-smithy{
  width:40px;font-family:var(--font-mono);font-size:12px;padding:3px 5px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text-secondary);text-align:end;
}

/* ===== COLLAPSIBLE ===== */
.collapsible{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.collapsible-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;cursor:pointer;background:var(--surface-2);
  font-size:12px;font-weight:500;color:var(--text-secondary);
  user-select:none;
}
.collapsible-header:hover{background:var(--border);}
.collapsible-header .chevron{font-size:10px;transition:transform var(--dur-fast);}
.collapsible-body{padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;}
.collapsible.open .chevron{transform:rotate(180deg);}

/* ===== INPUTS ===== */
.input-field{
  font-family:inherit;font-size:13px;padding:5px 8px;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);width:100%;
}
.input-field::placeholder{color:var(--text-tertiary);}
.input-sm{width:72px;}
.input-xs{width:52px;}
.input-row{display:flex;align-items:center;gap:8px;}
.input-label{font-size:12px;color:var(--text-secondary);white-space:nowrap;}

/* ===== DEFENDER PANEL ===== */
.defender-panel{
  border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;
}
.defender-header{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface-2);border-bottom:1px solid var(--border);
}
.defender-title{font-size:12px;font-weight:600;color:var(--text-secondary);flex:1;}
.defender-body{padding:12px;display:flex;flex-direction:column;gap:8px;}
.btn-ghost{
  background:none;border:none;cursor:pointer;padding:2px 6px;
  border-radius:var(--radius-sm);font-size:12px;color:var(--text-tertiary);
  font-family:inherit;
}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}

/* ===== BUTTONS ===== */
.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:10px 16px;border:none;border-radius:var(--radius-sm);
  background:var(--btn-primary-bg);color:var(--btn-primary-text);
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  transition:background var(--dur-fast);
}
.btn-primary:hover{background:var(--btn-primary-hover);}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-secondary{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);
  font-family:inherit;font-size:13px;cursor:pointer;
  transition:background var(--dur-fast);
}
.btn-secondary:hover{background:var(--surface-2);}

/* ===== RESULT BADGE ===== */
.result-badge{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:var(--radius-sm);border:1px solid;
}
.result-badge.win{
  background:var(--success-subtle);border-color:var(--success);
}
.result-badge.lose{
  background:var(--danger-subtle);border-color:var(--danger);
}
.result-badge-icon{font-size:20px;}
.result-badge-main{flex:1;}
.result-badge-title{font-size:15px;font-weight:600;}
.result-badge.win .result-badge-title{color:var(--success);}
.result-badge.lose .result-badge-title{color:var(--danger);}
.result-badge-sub{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.result-ratio{font-family:var(--font-mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
.result-badge.win .result-ratio{color:var(--success);}
.result-badge.lose .result-ratio{color:var(--danger);}

/* ===== RESULT TABLE ===== */
.result-section-title{
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-secondary);margin-bottom:6px;
}
.result-table{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
.result-table th{
  background:var(--surface-2);padding:6px 10px;
  font-size:11px;font-weight:500;color:var(--text-secondary);
  text-align:start;letter-spacing:.04em;
  border-bottom:1px solid var(--border);
}
.result-table th.num,.result-table td.num{text-align:end;}
.result-table td{
  padding:7px 10px;font-size:13px;border-bottom:1px solid var(--border);
}
.result-table tr:last-child td{border-bottom:none;}
.result-table tr:hover td{background:var(--surface-2);}
.num-cell{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;}
.cell-won{color:var(--success);}
.cell-lost{color:var(--danger);}
.cell-dim{color:var(--text-disabled);}
.troop-cell{display:flex;align-items:center;gap:6px;}
.troop-icon-sm{width:20px;height:20px;border-radius:3px;background:var(--surface-2);
  display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--text-tertiary);}

/* ===== LOOT PANEL ===== */
.loot-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px 16px;display:flex;flex-direction:column;gap:8px;
}
.loot-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.loot-label{font-size:13px;color:var(--text-secondary);}
.loot-value{font-family:var(--font-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
.loot-animals{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.resource-chip{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-full);padding:3px 8px;font-size:12px;
}
.resource-chip .res-icon{font-size:14px;}
.resource-chip .res-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;}
.resource-total{font-size:12px;font-weight:600;font-family:var(--font-mono);color:var(--text);}

/* ===== WARNING CHIPS ===== */
.warning-row{display:flex;flex-wrap:wrap;gap:6px;}
.warning-chip{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--accent-subtle);color:var(--accent-text);
  border:1px solid var(--accent);border-radius:var(--radius-full);
  padding:2px 8px;font-size:11px;font-weight:500;
}

/* ===== EMPTY / ERROR / LOADING STATE ===== */
.state-area{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:48px 24px;text-align:center;
  color:var(--text-secondary);
}
.state-icon{font-size:36px;color:var(--text-tertiary);}
.state-title{font-size:15px;font-weight:600;color:var(--text);}
.state-desc{font-size:13px;max-width:280px;line-height:1.5;}
.state-area.error .state-icon{color:var(--danger);}
.error-detail{
  font-size:12px;font-family:var(--font-mono);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 12px;max-width:360px;text-align:start;color:var(--text-secondary);
}

/* ===== SPINNER ===== */
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--text-secondary);
  animation:spin .8s linear infinite;
}

/* ===== OPTIMIZER TABLE ===== */
.opt-table{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
.opt-table th{
  background:var(--surface-2);padding:6px 10px;
  font-size:11px;font-weight:500;color:var(--text-secondary);
  text-align:start;letter-spacing:.04em;border-bottom:1px solid var(--border);
}
.opt-table td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--border);cursor:pointer;}
.opt-table tr:last-child td{border-bottom:none;}
.opt-table tr:hover td{background:var(--surface-2);}
.opt-table tr.selected td{background:var(--accent-subtle);}
.win-badge{
  display:inline-flex;align-items:center;gap:3px;
  border-radius:var(--radius-full);padding:2px 7px;font-size:11px;font-weight:500;
}
.win-badge.yes{background:var(--success-subtle);color:var(--success);border:1px solid var(--success);}
.win-badge.no{background:var(--danger-subtle);color:var(--danger);border:1px solid var(--danger);}
.troop-icons-row{display:flex;align-items:center;gap:3px;}
.troop-icon-xs{
  width:20px;height:20px;border-radius:3px;background:var(--surface-2);
  display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--text-tertiary);
  flex-shrink:0;position:relative;
}
.troop-count{font-size:10px;color:var(--text-secondary);font-family:var(--font-mono);}

/* ===== NO WINNER BANNER ===== */
.no-winner-banner{
  display:flex;align-items:center;gap:10px;
  background:var(--danger-subtle);border:1px solid var(--danger);
  border-radius:var(--radius-sm);padding:10px 14px;
  font-size:13px;color:var(--danger);
}

/* ===== ALTERNATIVE DETAIL ===== */
.alt-detail{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:16px;
  display:flex;flex-direction:column;gap:12px;
}
.alt-detail-header{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px solid var(--border);
}

/* ===== SLIDER ===== */
.slider-row{display:flex;align-items:center;gap:8px;}
.slider-label{font-size:12px;color:var(--text-secondary);min-width:120px;}
input[type=range]{flex:1;accent-color:var(--accent);}
.slider-val{font-family:var(--font-mono);font-size:12px;color:var(--text);min-width:28px;text-align:end;}

/* ===== ACTIVE MODIFIERS CARD ===== */
.mods-card{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:32px;
}
.mods-card-empty{
  width:100%;text-align:center;font-size:11px;color:var(--text-tertiary);font-style:italic;
}
.mod-chip{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-full);
  padding:2px 8px;font-size:11px;color:var(--text-secondary);
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  cursor:default;
}
.mod-chip.smithy{
  background:var(--accent-subtle);color:var(--accent-text);border-color:var(--accent);
  font-family:var(--font-sans);font-variant-numeric:normal;
}

/* ===== CALC CHAIN ===== */
.chain-details{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  overflow:hidden;
}
.chain-summary{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--text-secondary);
  background:var(--surface-2);user-select:none;list-style:none;
}
.chain-summary::-webkit-details-marker{display:none;}
.chain-summary:hover{background:var(--border);}
.chain-body{padding:14px 16px;display:flex;flex-direction:column;gap:2px;}
.chain-section{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-tertiary);margin-block:8px 4px;}
.chain-section:first-child{margin-block-start:0;}
.chain-row{display:flex;align-items:baseline;gap:8px;padding:2px 0;}
.chain-label{font-size:13px;color:var(--text-secondary);min-width:140px;flex-shrink:0;}
.chain-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--text);}
.chain-row.final .chain-label,.chain-row.final .chain-value{font-weight:600;color:var(--text);}
.chain-divider{border:none;border-top:1px solid var(--border);margin-block:6px;}
.chain-smithy-row{display:flex;align-items:center;gap:6px;padding:2px 0;}
.chain-smithy-icon{width:18px;height:18px;border-radius:3px;background:var(--surface-2);
  display:grid;place-items:center;font-size:8px;font-weight:700;color:var(--text-tertiary);flex-shrink:0;}
.chain-smithy-name{font-size:12px;color:var(--text-secondary);flex:1;}
.chain-smithy-val{font-family:var(--font-mono);font-size:12px;color:var(--text);font-variant-numeric:tabular-nums;}

/* ===== DISABLED INPUT ===== */
input:disabled{opacity:.45;cursor:not-allowed;background:var(--surface-2);}

/* ===== CALC SINGLE-COLUMN LAYOUT (layout real del código) ===== */
/* El código usa maxWidth:720px, flex-direction:column — NO 2 columnas */
/* .calc-single es el scroll container directo dentro de view-container */
.calc-single{
  max-width:720px;margin:0 auto;padding:24px;
  display:flex;flex-direction:column;gap:0;
  overflow-y:auto;width:100%;height:100%;box-sizing:border-box;
  /* view-container tiene overflow:hidden; calc-single hace scroll internamente */
}

/* ===== ARMY PANEL (reflejo de ArmyPanel.jsx) ===== */
.army-panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;margin-bottom:8px;
}
.army-panel-header{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid var(--border);background:var(--surface-2);
}
.army-panel-icon{display:flex;align-items:center;flex-shrink:0;}
.army-panel-icon.atk{color:var(--danger);}
.army-panel-icon.def{color:var(--info);}
.army-panel-icon.reinf{color:var(--text-secondary);}
.army-panel-label{
  flex:1;font-size:13px;font-weight:600;color:var(--text);
  text-transform:uppercase;letter-spacing:.04em;
}
.army-panel-btn{
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border:none;background:transparent;
  cursor:pointer;color:var(--text-secondary);border-radius:var(--radius-sm);
  font-size:12px;
}
.army-panel-btn.danger{color:var(--danger);}
.army-panel-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}

/* ===== CONTROLS ROW (fila inline en ArmyPanel — atacante / defensor) ===== */
.ctrl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}

/* AttackTypeToggle (pill raid/attack) */
.atk-toggle{
  display:flex;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border-strong);
}
.atk-toggle-btn{
  height:26px;padding:0 10px;border:none;
  background:var(--surface-2);color:var(--text-secondary);
  font-size:12px;font-weight:400;cursor:pointer;font-family:inherit;
  transition:background var(--dur-fast),color var(--dur-fast);
}
.atk-toggle-btn.active{
  background:var(--btn-primary-bg);color:var(--btn-primary-text);font-weight:600;
}

/* AllianceBonusSelect y ArtifactSelect */
.ctrl-select{
  height:26px;padding:0 6px;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;
}

/* NumInput (muro / cantero) */
.num-input-sm{
  width:42px;height:26px;padding:0 4px;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-size:13px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  color:var(--text);text-align:center;box-sizing:border-box;
}
.ctrl-icon{
  display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);
}

/* Héroe expand button */
.hero-expand-btn{
  height:26px;padding:0 8px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--text-secondary);
  border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:4px;
  transition:background var(--dur-fast),color var(--dur-fast);
}
.hero-expand-btn.open{
  background:var(--accent-subtle);color:var(--accent-text);
  border-color:var(--accent);
}

/* Hero inputs expanded block */
.hero-expanded-block{
  display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;
  background:var(--surface-2);border-radius:var(--radius-sm);
}
.hero-field{display:flex;flex-direction:column;gap:3px;}
.hero-field-label{font-size:11px;color:var(--text-secondary);}
.hero-field-input{
  width:70px;height:26px;padding:0 4px;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-size:13px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  color:var(--text);text-align:center;box-sizing:border-box;
}
.hero-field-input.narrow{width:60px;}

/* ===== TRIBE BAR (chips circulares 44px — TribeBar.jsx) ===== */
.tribe-bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;}
.tribe-chip{
  width:44px;height:44px;border-radius:var(--radius-full);
  border:2px solid var(--border);outline:none;
  background:var(--surface-2);color:var(--text-secondary);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;font-family:inherit;letter-spacing:.01em;
  transition:border-color var(--dur-fast),background var(--dur-fast),color var(--dur-fast);
  flex-shrink:0;user-select:none;
}
.tribe-chip.active-ro{background:#E8E0F0;color:#5B3A8A;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}
.tribe-chip.active-te{background:#E8EAD8;color:#4A5230;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}
.tribe-chip.active-ga{background:#D8EEE0;color:#1E6040;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}
.tribe-chip.active-eg{background:#F0E8D0;color:#7A5010;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}
.tribe-chip.active-hu{background:#F0D8D8;color:#7A1E1E;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}
.tribe-chip.active-sp{background:#D8E4F0;color:#1E3E7A;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}
.tribe-chip.active-vi{background:#D8ECF0;color:#1E5E6A;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}
.tribe-chip.active-na{background:#E4F0D8;color:#2E6020;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;}

/* ===== TROOP GRID (horizontal — TroopGrid.jsx) ===== */
.troop-grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.troop-grid{
  display:flex;align-items:flex-start;gap:6px;min-width:max-content;
}
/* Columna de etiquetas de fila */
.troop-grid-labels{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  flex-shrink:0;padding-top:32px; /* alinear con los inputs (icono 28px + 4px gap) */
}
.troop-grid-label-spacer{height:28px;}
.troop-grid-label-icon{
  height:28px;display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);
}
.troop-grid-label-smithy{
  height:24px;display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);
}
/* Celda de tropa (columna vertical) */
.troop-cell-col{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  flex-shrink:0;transition:opacity var(--dur-fast);
}
.troop-cell-col.dim-col{opacity:.45;}
.troop-cell-icon{
  width:52px;height:28px;display:flex;align-items:center;justify-content:center;
}
.troop-cell-icon-badge{
  width:24px;height:24px;border-radius:3px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:var(--text-tertiary);
}
.troop-qty-input{
  width:52px;height:28px;padding:0 4px;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-size:13px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  color:var(--text);text-align:center;box-sizing:border-box;
}
.troop-smithy-input{
  width:52px;height:24px;padding:0 4px;background:transparent;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  color:var(--text);text-align:center;box-sizing:border-box;
}

/* ===== TRAVIAN REPORT (TravianReport.jsx — resultado real) ===== */
.tr-report{display:flex;flex-direction:column;gap:0;margin-top:16px;}

/* Badge ganador */
.tr-winner-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px;border-radius:var(--radius-full);
  font-size:14px;font-weight:600;
}
.tr-winner-badge.atk-wins{
  background:rgba(36,138,61,.12);border:1px solid var(--success);color:var(--success);
}
.tr-winner-badge.def-wins{
  background:rgba(201,53,44,.12);border:1px solid var(--danger);color:var(--danger);
}
.tr-badge-row{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;
}
.tr-ratio{font-size:13px;color:var(--text-secondary);font-family:var(--font-mono);}

/* TroopBand (sección Tú / Defensor) */
.tr-band{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;margin-bottom:14px;
}
.tr-band-header{
  padding:8px 14px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid;
}
.tr-band-header.atk{
  background:rgba(201,53,44,.12);border-bottom-color:var(--danger);
}
.tr-band-header.def{
  background:rgba(40,84,166,.12);border-bottom-color:var(--accent);
}
.tr-band-title{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
}
.tr-band-header.atk .tr-band-title{color:var(--danger);}
.tr-band-header.def .tr-band-title{color:var(--accent-text);}

/* Tabla interior de TroopBand */
.tr-table{
  border-collapse:collapse;table-layout:fixed;width:100%;
}
.tr-table th{
  padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);
  font-size:11px;font-weight:500;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.04em;text-align:start;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tr-table th.tc{text-align:center;}
.tr-table td{
  padding:7px 10px;border-bottom:1px solid var(--border);
  font-size:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tr-table td.label-td{
  text-align:start;background:var(--surface-2);font-family:var(--font-sans);
  color:var(--text-secondary);white-space:nowrap;
}
.tr-table td.r-sent{color:var(--text);}
.tr-table td.r-lost{color:var(--danger);}
.tr-table td.r-surv{color:var(--success);font-weight:600;}
.tr-table tr:last-child td{border-bottom:none;}

/* StatsTable */
.tr-stats{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;
}
.tr-stats-header{
  background:var(--surface-2);padding:8px 14px;
  border-bottom:1px solid var(--border);
}
.tr-stats-title{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text);
}
.tr-stats-table{width:100%;border-collapse:collapse;}
.tr-stats-table th{
  padding:8px 12px;font-size:11px;font-weight:600;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);
  text-align:start;
}
.tr-stats-table th.pct-th{text-align:end;width:64px;}
.tr-stats-table td.lbl{
  padding:8px 12px;font-size:12px;color:var(--text-secondary);
  background:var(--surface-2);white-space:nowrap;width:180px;
}
.tr-stats-table td.val{
  padding:8px 12px;font-size:13px;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);
}
.tr-stats-table td.val-icon{padding:8px 12px;}
.tr-stats-table td.pct{
  padding:8px 6px;text-align:end;color:var(--text-tertiary);
  font-family:var(--font-mono);font-size:12px;font-weight:600;width:64px;
}
.tr-stats-table tr{border-bottom:1px solid var(--border);}

/* Sub-tabla de recursos (botín/coste/neto) */
.tr-res-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.tr-res-table th{
  padding:8px 6px;font-size:11px;font-weight:600;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);
  text-align:center;background:var(--surface-2);box-sizing:border-box;
}
.tr-res-table th.lbl-th{text-align:start;padding:8px 12px;width:180px;}
.tr-res-table th.sum-th{text-align:center;width:88px;}
.tr-res-table td{
  padding:8px 6px;text-align:center;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;
  border-bottom:1px solid var(--border);
}
.tr-res-table td.lbl{
  padding:8px 12px;font-size:12px;color:var(--text-secondary);
  background:var(--surface-2);text-align:start;width:180px;
}
.tr-res-table td.sum{text-align:end;padding:8px 10px;font-weight:600;width:88px;}
.tr-res-table td.gain{color:var(--success);}
.tr-res-table td.cost{color:var(--danger);}
.tr-res-table td.net-pos{color:var(--success);font-weight:700;}
.tr-res-table td.net-neg{color:var(--danger);font-weight:700;}
.tr-res-table td.net-zero{color:var(--text-tertiary);font-weight:700;}
.tr-res-table tr.net-row{background:var(--surface-2);}
.tr-res-table tr.net-row td.lbl{font-weight:700;color:var(--text);}

/* Warnings del simulador */
.tr-warnings{display:flex;flex-direction:column;gap:4px;margin-top:14px;}
.tr-warning-label{
  font-size:12px;font-weight:600;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;
}
.tr-warning-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;background:var(--accent-subtle);color:var(--accent-text);
  border-radius:var(--radius-full);font-size:12px;
}

/* Botón "Añadir refuerzo" */
.add-reinf-btn{
  height:32px;width:100%;padding:0 14px;background:transparent;
  border:1px dashed var(--border-strong);border-radius:var(--radius-sm);
  font-size:13px;color:var(--text-secondary);cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:6px;justify-content:center;
  margin-bottom:12px;
  transition:border-color var(--dur-fast),color var(--dur-fast);
}
.add-reinf-btn:hover{border-color:var(--accent);color:var(--accent-text);}

/* Botón Simular (40px, full-width, monocromo) */
.simulate-btn{
  height:40px;width:100%;background:var(--btn-primary-bg);color:var(--btn-primary-text);
  border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;
  justify-content:center;gap:8px;letter-spacing:-0.01em;
}

/* ===== RADIO ===== */
.radio-group{display:flex;flex-direction:column;gap:6px;}
.radio-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;
}
.radio-item.selected{border-color:var(--accent);background:var(--accent-subtle);}
.radio-dot{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);
  display:grid;place-items:center;flex-shrink:0;
}
.radio-item.selected .radio-dot{border-color:var(--accent);}
.radio-dot-inner{width:6px;height:6px;border-radius:50%;background:var(--accent);display:none;}
.radio-item.selected .radio-dot-inner{display:block;}
.radio-label{font-size:13px;color:var(--text);}

/* ===== CHECKBOX ===== */
.check-row{display:flex;align-items:center;gap:6px;padding:4px 0;}
.check-box{
  width:14px;height:14px;border:2px solid var(--border-strong);border-radius:3px;
  background:var(--surface);flex-shrink:0;display:grid;place-items:center;cursor:pointer;
}
.check-box.checked{background:var(--accent);border-color:var(--accent);}
.check-mark{color:#fff;font-size:9px;font-weight:700;display:none;}
.check-box.checked .check-mark{display:block;}
.check-label{font-size:13px;color:var(--text);}

/* ===== DRAG & DROP EDIT ===== */
.edit-mode .draggable{
  cursor:grab;position:relative;
}
.edit-mode .draggable:hover::before{
  content:'⠿';position:absolute;inset-inline-start:-20px;top:50%;transform:translateY(-50%);
  color:var(--text-disabled);font-size:16px;pointer-events:none;
}
.edit-mode .draggable.dragging{opacity:.5;cursor:grabbing;}
.edit-mode .draggable.drag-over{outline:2px dashed var(--accent);}

/* ===== SECTION BLOCK ===== */
.section-block{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:16px;
  display:flex;flex-direction:column;gap:12px;
}

/* Separador visual */
hr.hairline{border:none;border-top:1px solid var(--border);margin:4px 0;}
</style>
</head>

/* ===== VISTA 7 — RESINCRONIZADA: baseline real + addendum ===== */
/*
  Layout REAL del código (CombatCalculator.jsx):
    maxWidth:720px, margin:0 auto, flex-direction:column
  NO hay 2 columnas. Todo en columna única con scroll propio del tab-content.

  ArmyPanel.jsx:
    - <section> con header (icono rol + label UPPERCASE + btn colapsar)
    - Body: fila de controles inline → TribeBar (chips 44px) → TroopGrid (horizontal)
    - Atacante: AttackTypeToggle + AllianceBonusSelect + ArtifactSelect + btn Héroe
    - Defensor: escudo + NumInput muro + ⚒ + NumInput cantero + AllianceBonusSelect + btn Héroe
    - Héroe: bloque colapsable inline con 2 campos (pts + bonus%)
    - Refuerzo: igual que defensor + btn eliminar (papelera)

  TribeBar.jsx:
    - Chips circulares 44px con iniciales 2 letras. NO select.

  TroopGrid.jsx:
    - Grid horizontal con scroll. Columna etiquetas (escudo + yunque) + columnas de tropa.
    - Cada columna: icono 28px / input qty 52×28px / input smithy 52×24px.
    - Columnas con qty=0 → opacity 0.45.

  TravianReport.jsx (resultado):
    - Badge winner (pill) + ratio string.
    - TroopBand "Tú": tabla fixed con col "Tropa" (104px) + cols por tropa.
      Filas: [iconos en header] / Enviadas / Pérdidas / Supervivientes.
    - TroopBand "Defensor": misma estructura.
    - StatsTable: tabla Infantería/Caballería (icon+valor, col Atacante, col Defensor, col %)
      + sub-tabla recursos (col lbl 180px + Wood/Clay/Iron/Crop + Σ): Botín/Coste/Neto.
    - Warnings: lista de pills debajo.

  ADDENDUM (pendiente de implementar, encajado en la composición real):
    - Mini-tarjeta "modificadores activos" debajo de los controles de cada ArmyPanel.
    - Inputs nuevos en el body del atacante: morale%, diet× (en la sección héroe/artefactos).
    - Inputs nuevos en el body del defensor: wall_tribe select, artefacto strong_buildings.
    - Bloque Configuración (colapsable, P3): server_speed + distance_fields.
    - Bloque "Cadena de cálculo" (colapsable, en el resultado, debajo de TroopBands).
*/
function view7_addendum(){
  /* ── Helper: chip de tribu ── */
  function tribeChip(initials, label, activeClass){
    return `<button class="tribe-chip ${activeClass}" type="button"
      role="radio" aria-checked="${activeClass!==''}" aria-label="${label}" title="${label}">
      ${initials}
    </button>`;
  }

  /* ── Helper: columna de tropa en TroopGrid ── */
  function troopCol(initials, qty, smithy){
    const dim = qty === 0 ? 'dim-col' : '';
    return `<div class="troop-cell-col ${dim}">
      <div class="troop-cell-icon">
        <div class="troop-cell-icon-badge">${initials}</div>
      </div>
      <input class="troop-qty-input" type="text" inputmode="numeric"
        value="${qty>0?qty:''}" placeholder="0"
        aria-label="${initials} — Cantidad"/>
      <input class="troop-smithy-input" type="text" inputmode="numeric"
        value="${smithy>0?smithy:''}" placeholder=""
        aria-label="${initials} — Herrería"/>
    </div>`;
  }

  /* ── TroopGrid horizontal ── */
  function troopGrid(troops, showSmithy=true){
    return `<div class="troop-grid-wrap">
      <div class="troop-grid">
        <!-- Etiquetas de fila -->
        <div class="troop-grid-labels">
          <div class="troop-grid-label-spacer"></div>
          <div class="troop-grid-label-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              style="width:14px;height:14px;" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          ${showSmithy?`<div class="troop-grid-label-smithy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              style="width:14px;height:14px;" aria-hidden="true">

            </svg>
          </div>`:''}
        </div>
        <!-- Columnas de tropa -->
        ${troops.map(t=>troopCol(INITIALS(t.name), t.qty, t.smithy||0)).join('')}
      </div>
    </div>`;
  }

  /* ── ArmyPanel real ── */
  function armyPanel({role, label, iconClass, controls, tribeChips, troopsGrid, heroBlock, modsCard, defenderExtras}){
    return `<section class="army-panel draggable" data-block="army-${role}" role="region" aria-label="${label}">

  /* ── TroopBand (tabla TravianReport) ── */

  /* ── StatsTable (TravianReport) ── */
  function statsTable(){

  '3': () => `<div class="calc-layout">${formPanel_simulator()}${resultPanel_simulator(false)}</div>`,
  '4': () => `<div class="calc-layout">${formPanel_optimizer()}<div class="calc-result-panel"><div class="state-area"><div class="state-icon">🎯</div><div class="state-title">Sin optimización</div><p class="state-desc">Selecciona tropas y la defensa del oasis, luego pulsa <strong>Optimizar</strong>.</p></div></div></div>`,
  '5': () => `<div class="calc-layout">${formPanel_optimizer()}${resultPanel_optimizer()}</div>`,
  '6': () => viewError(),
  '7': () => view7_addendum(),
};

function setView(v){
  const container = document.getElementById('view-container');
  container.innerHTML = views[v]();
  if(window._editMode) enableEditMode();
}

/* ===== THEME ===== */
let _dark = false;
function toggleTheme(){
  _dark = !_dark;
  document.documentElement.dataset.theme = _dark ? 'dark' : 'light';
  document.getElementById('theme-btn').textContent = _dark ? '☀ Claro' : '🌙 Oscuro';
}

/* ===== EDIT MODE — drag & drop ===== */
window._editMode = false;
let _dragSrc = null;

function toggleEdit(){
  window._editMode = !window._editMode;
  const btn = document.getElementById('edit-btn');
  btn.classList.toggle('active', window._editMode);
  btn.textContent = window._editMode ? '✓ Editar ON' : '✎ Editar';
  if(window._editMode) enableEditMode();
  else disableEditMode();
}

function enableEditMode(){
  document.getElementById('view-container').classList.add('edit-mode');
  document.querySelectorAll('.draggable').forEach(el=>{
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart',onDragStart);
    el.addEventListener('dragover',onDragOver);
    el.addEventListener('drop',onDrop);
    el.addEventListener('dragend',onDragEnd);
    el.addEventListener('dragleave',onDragLeave);
  });
}

function disableEditMode(){
  document.getElementById('view-container').classList.remove('edit-mode');
  document.querySelectorAll('.draggable').forEach(el=>{
    el.setAttribute('draggable','false');
  });
}

function snap8(v){ return Math.round(v/8)*8; }

function onDragStart(e){
  _dragSrc = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain', this.dataset.block||'');
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  this.classList.add('drag-over');
}
function onDragLeave(){ this.classList.remove('drag-over'); }
function onDrop(e){
  e.stopPropagation();
  this.classList.remove('drag-over');
  if(_dragSrc && _dragSrc!==this){
    const parent = this.parentNode;
    const srcIdx = [...parent.children].indexOf(_dragSrc);
    const tgtIdx = [...parent.children].indexOf(this);
    if(srcIdx<tgtIdx) parent.insertBefore(_dragSrc, this.nextSibling);
    else parent.insertBefore(_dragSrc, this);
  }
}
function onDragEnd(){ this.classList.remove('dragging'); _dragSrc=null; }

/* ===== SAVE / RESTORE / EXPORT ===== */
function getLayout(){
  const blocks=[];
  document.querySelectorAll('.draggable[data-block]').forEach(el=>{
    blocks.push(el.dataset.block);
  });
  return {view: document.getElementById('view-select').value, blocks};
}

function saveLayout(){
  localStorage.setItem('calc-playground-layout', JSON.stringify(getLayout()));
  showToastMsg('Layout guardado');
}

function resetLayout(){
  localStorage.removeItem('calc-playground-layout');
  setView(document.getElementById('view-select').value);
  showToastMsg('Layout restablecido');
}

function exportLayout(){
  const data = JSON.stringify(getLayout(), null, 2);
  const blob = new Blob([data],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'simulador-combate-layout.json';
  a.click();
  showToastMsg('Layout exportado');
}

function showToastMsg(msg){
  let t = document.getElementById('__toast');
  if(!t){ t=document.createElement('div'); t.id='__toast';
    Object.assign(t.style,{
      position:'fixed',insetInline:'0',bottom:'24px',margin:'auto',width:'max-content',
      maxWidth:'90vw',background:'var(--btn-primary-bg)',color:'var(--btn-primary-text)',
      padding:'10px 16px',borderRadius:'var(--radius-sm)',boxShadow:'var(--shadow-lg)',
      fontSize:'13px',zIndex:'9999',opacity:'0',transform:'translateY(8px)',
      transition:'opacity 220ms, transform 220ms',pointerEvents:'none',
    });
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1'; t.style.transform='translateY(0)';
  clearTimeout(t._tid); t._tid=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(8px)';},2500);
}

/* ===== UI HELPERS ===== */
function toggleCollapsible(header){
  const body = header.nextElementSibling;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'flex';
  header.parentElement.classList.toggle('open', !isOpen);
}

function selectMode(el, mode){
  document.querySelectorAll('.radio-item').forEach(r=>r.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('mode-a-panel').style.display = mode==='A'?'flex':'none';
  document.getElementById('mode-b-panel').style.display = mode==='B'?'flex':'none';
}

function toggleCheck(box){
  box.classList.toggle('checked');
  const smithy = box.closest('.troop-row').querySelector('.troop-smithy');
  if(smithy) smithy.disabled = !box.classList.contains('checked');
}

function selectAlt(i){
  document.querySelectorAll('.opt-table tr').forEach(r=>r.classList.remove('selected'));
  const row = document.getElementById('alt-row-'+i);
  if(row) row.classList.add('selected');
  const detail = document.getElementById('alt-detail');
  if(detail){
    detail.style.display='flex';
    document.getElementById('alt-detail-rank').textContent = i+1;
  }
}

function closeAltDetail(){
  const detail = document.getElementById('alt-detail');
  if(detail) detail.style.display='none';
  document.querySelectorAll('.opt-table tr').forEach(r=>r.classList.remove('selected'));
}

/* ===== INIT ===== */
setView('1');

// Restaurar layout guardado si existe
const saved = localStorage.getItem('calc-playground-layout');
if(saved){
  try{
    const data = JSON.parse(saved);
    if(data.view){
      document.getElementById('view-select').value = data.view;
      setView(data.view);
    }
  }catch(e){}
}
</script>
