<!DOCTYPE html>
<!--
  PLAYGROUND — Farm Lists Feedback (rediseño de navegación: 2026-05-27)
  Estructura REAL del frontend:
    - Topbar 52px | Sidebar 180px | Contenido | BottomBar 48px carrusel pills

  NUEVA JERARQUÍA (validada por usuario):
    El "dashboard" de stats NO es a nivel de aldea/mundo.
    Es un sub-panel que se abre DENTRO de un scheduler al hacer clic.
    Normalmente cerrado → clic en scheduler → se despliega inline mostrando
    KPIs (de ese scheduler) + feed de actividad (de ese scheduler) + alertas.

  Vistas:
    1. Agentes — lista cerrada (todos los schedulers colapsados)
    2. Agentes — scheduler A expandido (sub-panel abierto: KPIs+feed+alertas)
    3. Agentes — alertas sin leer en el sub-panel
    4. Agentes — sub-panel loading (skeletons)
    5. Drawer farm list — feedback SUCCESS debajo del botón enviar
    6. Drawer farm list — feedback PARTIAL + vacas desactivadas
    7. Drawer farm list — pestaña Stats (V9)
    8. Mobile 375px — scheduler expandido

  Controles: tema · vista · editar (drag&drop) · exportar JSON
  Spec: docs/design/farm-lists-feedback.md
-->
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TravianBot · Farm Lists Feedback (playground)</title>
<style>
/* ===== TOKENS (igual que el frontend real) ===== */
:root{
  --bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#EFEFF2;
  --border:#D2D2D7;--border-strong:#C7C7CC;
  --text:#1D1D1F;--text-secondary:#6E6E73;--text-tertiary:#8E8E93;--text-disabled:#AEAEB2;
  --accent:#8A6418;--accent-text:#8A6418;--accent-hover:#6F5012;--accent-subtle:rgba(138,100,24,.14);
  --btn-primary-bg:#1D1D1F;--btn-primary-text:#FFFFFF;--btn-primary-hover:#3A3A3C;
  --success:#248A3D;--danger:#C9352C;--info:#0A6FCC;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 2px 8px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-full:9999px;
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --ease:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-base:220ms;--dur-slow:300ms;
  --topbar-h:52px;--sidebar-w:180px;--bottombar-h:48px;
}
[data-theme="dark"]{
  --bg:#1D1D1F;--surface:#2C2C2E;--surface-2:#3A3A3C;
  --border:#3A3A3C;--border-strong:#48484A;
  --text:#F5F5F7;--text-secondary:#AEAEB2;--text-tertiary:#8E8E93;--text-disabled:#636366;
  --accent:#CBB079;--accent-text:#CBB079;--accent-hover:#D8C089;--accent-subtle:rgba(203,176,121,.16);
  --btn-primary-bg:#F5F5F7;--btn-primary-text:#1D1D1F;--btn-primary-hover:#E2E2E6;
  --success:#34C759;--danger:#FF453A;--info:#0A84FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 12px rgba(0,0,0,.5);--shadow-lg:0 12px 32px rgba(0,0,0,.6);
}

/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;overflow:hidden;
  transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}

/* ===== TOOLBAR DEL PLAYGROUND ===== */
.pg-toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 14px;border-bottom:2px solid var(--accent-subtle);
  background:var(--surface-2);flex-shrink:0;z-index:9999;}
.pg-label{font-size:11px;font-weight:700;color:var(--accent-text);text-transform:uppercase;
  letter-spacing:.08em;white-space:nowrap;}
.pg-sep{width:1px;height:16px;background:var(--border);flex-shrink:0;}
.tb-btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  height:28px;padding:0 10px;border-radius:var(--radius-sm);cursor:pointer;
  font-family:inherit;font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap;
  transition:background var(--dur-fast);}
.tb-btn:hover{background:var(--surface-2);}
.tb-btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:transparent;}
.tb-btn.active{border-color:var(--accent);color:var(--accent-text);background:var(--accent-subtle);}
.pg-select{height:28px;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);border-radius:var(--radius-sm);padding:0 8px;font-family:inherit;
  font-size:11px;cursor:pointer;max-width:300px;}
.pg-grow{flex:1;}
.pg-hint{color:var(--text-tertiary);font-size:10px;white-space:nowrap;}

/* ===== DRAG & DROP ===== */
body.editing .drag-block{
  outline:1px dashed var(--border-strong);border-radius:4px;cursor:grab;
  position:relative;}
body.editing .drag-block:hover{outline-color:var(--accent);}
body.editing .drag-block.dragging{cursor:grabbing;outline:2px solid var(--accent);
  box-shadow:var(--shadow-md);z-index:50;}
body.editing .drag-block::before{
  content:'⠿';position:absolute;top:4px;right:6px;
  font-size:14px;color:var(--accent-text);opacity:.6;z-index:10;pointer-events:none;}

/* ===== APP SHELL — TOPBAR (52px, estructura real) ===== */
.app-topbar{
  display:flex;align-items:center;gap:12px;
  padding:0 20px;height:52px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  z-index:50;}
.app-logo-btn{
  appearance:none;border:none;background:transparent;cursor:pointer;padding:0;
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  font-weight:600;font-size:15px;color:var(--text);}
.app-logo{width:28px;height:28px;border-radius:7px;
  background:var(--btn-primary-bg);color:var(--btn-primary-text);
  display:grid;place-items:center;font-weight:700;font-size:12px;}
/* Centro: email + estado (como el real) */
.topbar-center{
  flex:1;display:flex;align-items:center;justify-content:center;
  gap:6px;overflow:hidden;}
.topbar-email{font-size:13px;font-weight:500;color:var(--accent-text);
  font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-dot{color:var(--text-disabled);flex-shrink:0;}
.topbar-status{display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:500;color:var(--success);flex-shrink:0;}
.topbar-status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.topbar-server{font-size:12px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;}
.topbar-icon-btn{appearance:none;border:1px solid var(--border);background:transparent;
  color:var(--text-secondary);width:32px;height:32px;border-radius:var(--radius-sm);
  display:grid;place-items:center;cursor:pointer;font-size:14px;flex-shrink:0;}
.topbar-icon-btn:hover{background:var(--surface-2);color:var(--text);}

/* ===== APP BODY (sidebar + main) ===== */
.app-body{display:flex;flex:1;min-height:0;overflow:hidden;}

/* ===== SIDEBAR IZQUIERDO (180px, estructura real) ===== */
.app-sidebar{
  width:180px;flex-shrink:0;
  background:var(--surface);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;}
.sidebar-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;}
/* Botón nav (igual que el real) */
.nav-btn{
  appearance:none;border:none;
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:var(--radius-sm);cursor:pointer;
  background:transparent;color:var(--text);font-family:inherit;font-size:14px;
  text-align:start;width:100%;position:relative;
  transition:background var(--dur-fast) var(--ease);}
.nav-btn:hover:not([disabled]){background:var(--surface-2);}
.nav-btn[disabled]{color:var(--text-disabled);cursor:not-allowed;}
.nav-btn.active{background:var(--accent-subtle);color:var(--accent-text);font-weight:500;}
/* Barra de acento izquierda (activo) */
.nav-btn.active::before{
  content:'';position:absolute;inset-block:4px;inset-inline-start:0;
  width:3px;border-radius:var(--radius-full);background:var(--accent);}
.nav-icon{width:16px;height:16px;flex-shrink:0;font-size:14px;display:grid;place-items:center;}
.nav-label{flex:1;}
.nav-soon{font-size:10px;color:var(--text-disabled);font-family:var(--font-mono);
  text-transform:uppercase;letter-spacing:.04em;}

/* ===== CONTENIDO PRINCIPAL ===== */
.app-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.tab-content{flex:1;overflow-y:auto;padding:24px 24px 72px;}

/* ===== BOTTOM BAR (48px fijo, estructura real con carrusel) ===== */
.app-bottombar{
  position:fixed;bottom:0;left:0;right:0;
  height:48px;display:flex;align-items:center;gap:0;
  padding-inline-end:24px;
  background:var(--surface);border-top:1px solid var(--border);
  z-index:200;
  transition:background var(--dur-base) var(--ease);}
/* Botón estado (mismo ancho que sidebar: 180px) */
.bottombar-state-btn{
  width:180px;flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding-inline-start:24px;padding-inline-end:14px;
  height:100%;background:transparent;border:none;cursor:pointer;
  border-radius:var(--radius-sm);font-family:inherit;
  transition:background var(--dur-fast);}
.bottombar-state-btn:hover{background:var(--surface-2);}
.state-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.state-dot.running{background:var(--success);}
.state-dot.stopped{background:var(--danger);}
.state-label{font-size:13px;font-weight:500;white-space:nowrap;}
.state-label.running{color:var(--success);}
.state-label.stopped{color:var(--danger);}
/* Divisor */
.bottombar-divider{width:1px;height:20px;background:var(--border);flex-shrink:0;align-self:center;margin-inline-end:14px;}
/* Carrusel de pills */
.bottombar-carousel{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.bottombar-carousel::-webkit-scrollbar{display:none;}
.carousel-empty{font-size:12px;color:var(--text-disabled);}
/* Pill de tarea */
.task-pill{
  flex-shrink:0;width:168px;height:28px;padding:0 10px;
  border-radius:var(--radius-full);border:1px solid var(--border);
  background:var(--surface-2);display:flex;align-items:center;gap:6px;}
.task-pill.next{border-color:var(--accent);background:var(--accent-subtle);}
.pill-name{font-size:12px;font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.pill-time{font-size:12px;font-weight:600;font-family:var(--font-mono);
  color:var(--text);flex-shrink:0;}
.task-pill.next .pill-time{color:var(--accent-text);}

/* ===== COMPONENTES DEL DASHBOARD ===== */

/* KPI Cards */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-sm);}
.kpi-value{font-size:28px;font-weight:600;font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;line-height:1.1;}
.kpi-value.danger{color:var(--danger);}
.kpi-label{font-size:12px;color:var(--text-secondary);margin-top:4px;}

/* Dos columnas */
.two-col{display:flex;gap:20px;align-items:flex-start;}
.col-feed{flex:3;min-width:0;}
.col-alerts{flex:2;min-width:0;}

/* Panel genérico */
.panel{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
.panel-header{display:flex;align-items:center;gap:8px;padding:12px 16px;
  border-bottom:1px solid var(--border);}
.panel-title{font-size:13px;font-weight:600;flex:1;}
.panel-meta{font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono);}
.panel-link{appearance:none;border:none;background:transparent;
  color:var(--accent-text);font-size:11px;cursor:pointer;font-family:inherit;padding:0;white-space:nowrap;}
.panel-link:hover{color:var(--accent-hover);text-decoration:underline;}

/* Feed de actividad */
.feed-table{width:100%;border-collapse:collapse;}
.feed-row{border-bottom:1px solid var(--border);}
.feed-row:last-child{border-bottom:none;}
.feed-row.row-new{background:var(--accent-subtle);
  transition:background 1s var(--ease);}
.feed-row td{padding:9px 10px;font-size:13px;vertical-align:middle;}
.feed-row td:first-child{padding-left:16px;}
.feed-row td:last-child{padding-right:16px;}
.feed-list-name{font-weight:500;}
.feed-time{color:var(--text-tertiary);font-family:var(--font-mono);font-size:12px;white-space:nowrap;}
.feed-slots{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
.feed-origin{color:var(--text-secondary);font-size:12px;white-space:nowrap;}
.badge-new{display:inline-flex;align-items:center;background:var(--accent-subtle);
  color:var(--accent-text);font-size:10px;font-weight:700;padding:1px 6px;
  border-radius:var(--radius-full);text-transform:uppercase;letter-spacing:.04em;}
.feed-footer{padding:9px 16px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;
  padding:2px 8px;border-radius:var(--radius-full);white-space:nowrap;}
.badge.success{color:var(--success);background:rgba(36,138,61,.1);}
.badge.partial{color:var(--accent);background:var(--accent-subtle);}
.badge.error{color:var(--danger);background:rgba(201,53,44,.1);}
.badge.unknown{color:var(--text-tertiary);background:var(--surface-2);}

/* Panel alertas */
.alerts-toggle-btn{
  appearance:none;border:none;background:transparent;
  display:flex;align-items:center;gap:8px;padding:12px 16px;
  width:100%;text-align:start;cursor:pointer;font-family:inherit;
  border-bottom:1px solid var(--border);
  transition:background var(--dur-fast);}
.alerts-toggle-btn:hover{background:var(--surface-2);}
.unread-pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:1;}
.alerts-chevron{font-size:10px;color:var(--text-tertiary);transition:transform var(--dur-fast);}
.alerts-chevron.open{transform:rotate(180deg);}
.alert-row{display:flex;align-items:flex-start;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--border);}
.alert-row:last-child{border-bottom:none;}
.alert-icon{font-size:13px;flex-shrink:0;margin-top:1px;}
.alert-text{font-size:13px;}
.alert-meta{font-size:11px;color:var(--text-tertiary);margin-top:2px;}

/* Skeleton */
@keyframes pulse{0%,100%{opacity:.45;}50%{opacity:.9;}}
.skel{background:var(--surface-2);border-radius:4px;animation:pulse 1.5s ease infinite;}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;}
.empty-icon{font-size:36px;opacity:.35;margin-bottom:14px;}
.empty-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--text-secondary);max-width:300px;margin:0 auto 20px;}
.btn-primary{appearance:none;border:none;background:var(--btn-primary-bg);
  color:var(--btn-primary-text);height:34px;padding:0 18px;border-radius:var(--radius-sm);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;
  transition:background var(--dur-fast);}
.btn-primary:hover{background:var(--btn-primary-hover);}

/* ===== DRAWER (estructura real: desliza desde la derecha) ===== */
.drawer-backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.2);z-index:250;
  cursor:pointer;}
.drawer{
  position:absolute;inset-block:0;inset-inline-end:0;
  width:480px;background:var(--surface);
  box-shadow:var(--shadow-lg);z-index:300;
  display:flex;flex-direction:column;overflow:hidden;
  border-inline-start:1px solid var(--border);}
.drawer-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.drawer-title-block{flex:1;min-width:0;}
.drawer-title{font-size:16px;font-weight:600;}
.drawer-subtitle{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.drawer-close{appearance:none;border:none;background:transparent;
  color:var(--text-secondary);font-size:18px;cursor:pointer;padding:4px;line-height:1;
  border-radius:var(--radius-sm);transition:background var(--dur-fast);}
.drawer-close:hover{background:var(--surface-2);}
/* Tabs internas del drawer */
.drawer-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.drawer-tab{
  appearance:none;border:none;background:transparent;color:var(--text-secondary);
  flex:1;padding:9px 12px;cursor:pointer;font-family:inherit;font-size:13px;
  border-bottom:2px solid transparent;text-align:center;
  transition:color var(--dur-fast),border-color var(--dur-fast);}
.drawer-tab:hover{color:var(--text);}
.drawer-tab.active{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:500;}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 24px;}
.drawer-section{margin-bottom:20px;}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-tertiary);font-weight:600;margin-bottom:8px;}

/* Botón enviar */
.btn-send{appearance:none;border:1px solid var(--btn-primary-bg);background:var(--btn-primary-bg);
  color:var(--btn-primary-text);height:34px;padding:0 18px;border-radius:var(--radius-sm);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:8px;width:100%;justify-content:center;
  transition:background var(--dur-fast);}
.btn-send:hover{background:var(--btn-primary-hover);}

/* Panel feedback (V8) */
.feedback-panel{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:12px 14px;margin-top:10px;}
.feedback-cap{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-tertiary);font-weight:600;margin-bottom:8px;}
.feedback-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.feedback-ts{font-family:var(--font-mono);font-size:12px;color:var(--text-tertiary);}
.feedback-slots{font-size:14px;font-weight:500;margin-bottom:4px;}
.feedback-hr{border:none;border-top:1px solid var(--border);margin:8px 0;}
.feedback-deact-label{font-size:12px;color:var(--text-secondary);margin-bottom:5px;}
.feedback-tags{display:flex;flex-wrap:wrap;gap:5px;}
.deact-tag{background:rgba(201,53,44,.1);color:var(--danger);
  font-size:12px;padding:2px 8px;border-radius:var(--radius-full);}
.feedback-none{font-size:12px;color:var(--text-tertiary);}

/* Stats (V9) */
.stats-section{margin-bottom:20px;}
.stats-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-secondary);font-weight:600;margin-bottom:10px;}
.metrics-card{background:var(--surface-2);border-radius:var(--radius-md);padding:14px;}
.metric-row{display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 0;border-bottom:1px solid var(--border);}
.metric-row:last-child{border-bottom:none;}
.metric-lbl{font-size:13px;color:var(--text-secondary);}
.metric-val{font-size:14px;font-weight:600;font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;}
.metric-unit{font-size:12px;color:var(--text-tertiary);font-weight:400;margin-left:3px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-lbl{font-size:12px;color:var(--text-secondary);width:88px;flex-shrink:0;}
.bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:var(--radius-full);overflow:hidden;}
.bar-fill{height:100%;border-radius:var(--radius-full);}
.bar-fill.s{background:var(--success);}
.bar-fill.a{background:var(--accent);}
.bar-fill.d{background:var(--danger);}
.bar-fill.t{background:var(--text-tertiary);}
.bar-cnt{font-size:12px;color:var(--text-tertiary);font-family:var(--font-mono);
  width:74px;text-align:right;flex-shrink:0;}
.top-table{width:100%;border-collapse:collapse;}
.top-table tr{border-bottom:1px solid var(--border);}
.top-table tr:last-child{border-bottom:none;}
.top-table td{padding:7px 0;font-size:13px;}
.top-table td:last-child{text-align:right;font-family:var(--font-mono);

// ─── TEMA ─────────────────────────────────────────────────────────────────────
function toggleTheme(){
  isDark = !isDark;
  document.documentElement.dataset.theme = isDark ? 'dark' : '';
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Claro' : '🌙 Oscuro';
}

// ─── EDIT / DRAG & DROP ───────────────────────────────────────────────────────
function toggleEdit(){
  isEditing = !isEditing;
  document.body.classList.toggle('editing', isEditing);
  const btn = document.getElementById('editBtn');
  btn.classList.toggle('active', isEditing);
  btn.textContent = isEditing ? '✅ Editar' : '✏️ Editar bloques';
  if(isEditing) initDrag();
}

function initDrag(){
  const area = document.querySelector('.drag-area');
  if(!area) return;
  let dragging = null;
  area.querySelectorAll('.drag-block').forEach(el => {
    el.addEventListener('mousedown', e => {
      if(!isEditing) return;
      dragging = el; el.classList.add('dragging');
    });
  });
  document.addEventListener('mousemove', e => {
    if(!dragging) return;
    const siblings = [...area.querySelectorAll('.drag-block:not(.dragging)')];
    for(const s of siblings){
      const sr = s.getBoundingClientRect();
      if(e.clientY < sr.top + sr.height / 2){ area.insertBefore(dragging, s); break; }
      else if(s === siblings[siblings.length-1] && e.clientY > sr.top + sr.height/2){ area.appendChild(dragging); }
    }
  });
  document.addEventListener('mouseup', () => {
    if(dragging){ dragging.classList.remove('dragging'); dragging = null; }
  });
}

// ─── EXPORTAR ─────────────────────────────────────────────────────────────────
function exportLayout(){
  const area = document.querySelector('.drag-area');
  const blocks = area ? [...area.querySelectorAll('.drag-block')].map((el,i)=>({order:i,id:el.dataset.id||`block-${i}`})) : [];
  const data = JSON.stringify({view, blocks}, null, 2);
  const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([data],{type:'application/json'})),download:`layout-${view}.json`});
  a.click();
}

// ─── SWITCH VIEW ──────────────────────────────────────────────────────────────

  [...canvas.children].forEach(c=>{ if(!c.classList.contains('pg-badge')) c.remove(); });

}

// ─── SHELL: BOTTOM BAR (carrusel de pills) ───────────────────────────────────
function mkBottomBar(running=true, tasks=[]){
  const stateClass = running ? 'running' : 'stopped';
  const stateLabel = running ? 'Bot activo' : 'Bot parado';
  let pills = '';
  if(!running){
    pills = `<span class="carousel-empty">Bot parado — sin tareas</span>`;
  } else if(!tasks.length){
    pills = `<span class="carousel-empty">Sin tareas programadas</span>`;
  } else {
    pills = tasks.map((t,i)=>`
      <div class="task-pill ${i===0?'next':''}">
        <span class="pill-name">${t.name}</span>
        <span class="pill-time" ${i===0?'id="pillTimer"':''}>${t.time}</span>
      </div>`).join('');
  }
  return `<div class="drag-block" data-id="bottombar">
    <div class="app-bottombar">
      <button class="bottombar-state-btn">
        <span class="state-dot ${stateClass}"></span>
        <span class="state-label ${stateClass}">${stateLabel}</span>
      </button>
      <div class="bottombar-divider"></div>

    </div>

}

// ─── HELPER: PROBE OPTIONS INLINE ────────────────────────────────────────────
function showProbeOptions(tipo, btnEl){
  event.stopPropagation();
  // Toggle: si ya hay panel abierto, cerrarlo
  const existing = btnEl.parentNode.querySelector('.probe-options');
  if(existing){ existing.remove(); return; }
  // Leer nombre de villa desde el link hermano en el DOM
  const contentDiv = btnEl.closest('[style*="flex:1"]');
  const villaLink = contentDiv ? contentDiv.querySelector('a') : null;
  const villa = villaLink ? villaLink.textContent : 'Villa';
  const panel = document.createElement('div');
  panel.className = 'probe-options';
  panel.style.cssText = 'margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md)';
  if(tipo === 'activar'){
    panel.innerHTML = `<span style="font-size:11px;color:var(--text-secondary);width:100%;margin-bottom:2px">¿Activar sonda en <strong>${villa}</strong>?</span>
      <button onclick="showToast('Sonda activada — ${villa}');this.closest('.probe-options').remove()" style="appearance:none;border:1px solid var(--success);background:transparent;color:var(--success);font-size:11px;padding:2px 9px;border-radius:var(--radius-full);cursor:pointer;font-family:inherit">⚡ Activar</button>
      <button onclick="this.closest('.probe-options').remove()" style="appearance:none;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:11px;padding:2px 9px;border-radius:var(--radius-full);cursor:pointer;font-family:inherit">No</button>`;
  } else {
    panel.innerHTML = `<span style="font-size:11px;color:var(--text-secondary);width:100%;margin-bottom:2px">¿Cancelar sonda en <strong>${villa}</strong>?</span>
      <button onclick="showToast('Sonda cancelada — ${villa}');this.closest('.probe-options').remove()" style="appearance:none;border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:11px;padding:2px 9px;border-radius:var(--radius-full);cursor:pointer;font-family:inherit">✕ Cancelar</button>
      <button onclick="this.closest('.probe-options').remove()" style="appearance:none;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:11px;padding:2px 9px;border-radius:var(--radius-full);cursor:pointer;font-family:inherit">Mantener</button>`;
  }
  btnEl.parentNode.appendChild(panel);
}

// ─── HELPER: TOAST BREVE ─────────────────────────────────────────────────────
function showToast(msg){
  const toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--btn-primary-bg);color:var(--btn-primary-text);font-size:12px;padding:6px 14px;border-radius:var(--radius-full);z-index:9999;pointer-events:none;opacity:1;transition:opacity .5s';
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.style.opacity='0'; setTimeout(()=>toast.remove(),500); }, 1800);
}

function openListDrawer(name){
  document.getElementById('viewSel').value = 'v9';
  switchView('v9');
  showToast(name === 'ver-historial' ? '→ Historial completo' : `→ FarmListDrawer: ${name} (Historial)`);

function toggleSubpanel(id){
  const panel = document.getElementById('subpanel-'+id);
  if(!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function toggleSubAlerts(id){
  const body = document.getElementById('abody-'+id);
  const hint = document.getElementById('ahint-'+id);
  const chev = document.getElementById('achev-'+id);
  if(!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  hint.style.display = open ? 'block' : 'none';
  if(chev) chev.textContent = open ? '▼' : '▲';
}
